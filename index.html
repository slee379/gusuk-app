/* ══ 태그 입력 필드 ═══════════════════════════════════ */
const ICON_X='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';

/* ══ 마술봉 — 색이 이어지는 면을 따낸다 ══════════════════════
   사물 인식이 아니라 색의 연속을 따라간다. 벽, 상판, 목재 패널처럼
   "면"을 잡는 데 강하다. 모델을 받지 않으므로 오프라인·즉시 동작한다.

   흐름: 축소 → 클릭한 색과 비슷한 곳으로 번지기(flood fill)
        → 테두리 따기(marching squares) → 점 줄이기 → 다각형 */
const WAND_MAX = 340;   // 작업용 축소 한 변
let wandPx = null;      // {key,w,h,data} — 같은 사진이면 재사용

function wandPixels(im){
  const key=im.currentSrc||im.src;
  if(wandPx&&wandPx.key===key) return wandPx;
  const nw=im.naturalWidth, nh=im.naturalHeight;
  if(!nw||!nh) return null;
  const sc=Math.min(1,WAND_MAX/Math.max(nw,nh));
  const w=Math.max(1,Math.round(nw*sc)), h=Math.max(1,Math.round(nh*sc));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  let data;
  try{ g.drawImage(im,0,0,w,h); data=g.getImageData(0,0,w,h).data; }
  catch(e){ return null; }
  wandPx={key:key,w:w,h:h,data:data};
  return wandPx;
}

/* 클릭한 색에서 시작해 비슷한 이웃으로 번진다 */
function floodMask(px,sx,sy,tol){
  const w=px.w,h=px.h,d=px.data;
  const seed=(sy*w+sx)*4;
  const r0=d[seed],g0=d[seed+1],b0=d[seed+2];
  const mask=new Uint8Array(w*h);
  const stack=new Int32Array(w*h);
  let top=0;
  const t2=tol*tol;
  stack[top++]=sy*w+sx; mask[sy*w+sx]=1;
  while(top>0){
    const p=stack[--top];
    const x=p%w, y=(p-x)/w;
    /* 상하좌우 4방향 */
    if(x>0) push(p-1);
    if(x<w-1) push(p+1);
    if(y>0) push(p-w);
    if(y<h-1) push(p+w);
    function push(np){
      if(mask[np]) return;
      const i=np*4;
      const dr=d[i]-r0, dg=d[i+1]-g0, db=d[i+2]-b0;
      if(dr*dr+dg*dg+db*db>t2) return;
      mask[np]=1; stack[top++]=np;
    }
  }
  return mask;
}

/* 티끌 구멍 메우기 — 사방이 채워진 빈 칸은 채운다 */
function fillPinholes(mask,w,h){
  const out=mask.slice();
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const p=y*w+x;
    if(mask[p]) continue;
    if(mask[p-1]&&mask[p+1]&&mask[p-w]&&mask[p+w]) out[p]=1;
  }
  return out;
}

/* 클릭한 점이 속한 덩어리만 남긴다 (멀리 떨어진 같은 색은 버린다) */
function keepBlob(mask,w,h,sx,sy){
  const out=new Uint8Array(w*h);
  const stack=[sy*w+sx];
  if(!mask[sy*w+sx]) return out;
  out[sy*w+sx]=1;
  while(stack.length){
    const p=stack.pop();
    const x=p%w, y=(p-x)/w;
    const nb=[];
    if(x>0) nb.push(p-1);
    if(x<w-1) nb.push(p+1);
    if(y>0) nb.push(p-w);
    if(y<h-1) nb.push(p+w);
    for(const np of nb) if(mask[np]&&!out[np]){ out[np]=1; stack.push(np); }
  }
  return out;
}

/* marching squares — 마스크의 바깥 테두리를 한 바퀴 따라간다 */
function traceContour(mask,w,h){
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:mask[y*w+x];
  let sx=-1,sy=-1;
  for(let y=0;y<h&&sx<0;y++) for(let x=0;x<w;x++) if(mask[y*w+x]){sx=x;sy=y;break;}
  if(sx<0) return null;
  const pts=[];
  let px=sx, py=sy, dir="", guard=0, limit=(w+h)*8+2000;
  const startX=px, startY=py;
  do{
    const tl=at(px-1,py-1), tr=at(px,py-1), bl=at(px-1,py), br=at(px,py);
    const st=(tl?8:0)|(tr?4:0)|(br?2:0)|(bl?1:0);
    let nd;
    switch(st){
      case 1: nd="down"; break;
      case 2: nd="right"; break;
      case 3: nd="right"; break;
      case 4: nd="up"; break;
      case 5: nd=(dir==="right")?"up":"down"; break;
      case 6: nd="up"; break;
      case 7: nd="up"; break;
      case 8: nd="left"; break;
      case 9: nd="down"; break;
      case 10: nd=(dir==="up")?"left":"right"; break;
      case 11: nd="right"; break;
      case 12: nd="left"; break;
      case 13: nd="down"; break;
      case 14: nd="left"; break;
      default: return null;
    }
    pts.push([px,py]);
    if(nd==="up") py--; else if(nd==="down") py++;
    else if(nd==="left") px--; else px++;
    dir=nd;
  }while((px!==startX||py!==startY)&&++guard<limit);
  return pts.length>3?pts:null;
}

/* 점 줄이기 (Douglas-Peucker) — 수백 개를 수십 개로 */
function simplify(pts,eps){
  if(pts.length<4) return pts;
  const keep=new Uint8Array(pts.length);
  keep[0]=keep[pts.length-1]=1;
  const stack=[[0,pts.length-1]];
  while(stack.length){
    const [a,b]=stack.pop();
    if(b<=a+1) continue;
    const [ax,ay]=pts[a], [bx,by]=pts[b];
    const dx=bx-ax, dy=by-ay;
    const len=Math.hypot(dx,dy)||1;
    let far=-1, fd=eps;
    for(let i=a+1;i<b;i++){
      const d=Math.abs((pts[i][0]-ax)*dy-(pts[i][1]-ay)*dx)/len;
      if(d>fd){ fd=d; far=i; }
    }
    if(far>0){ keep[far]=1; stack.push([a,far],[far,b]); }
  }
  return pts.filter((_,i)=>keep[i]);
}

/* 클릭 지점(0~1 비율) → 다각형 영역. 못 찾으면 null */
function wandSelect(im,fx,fy,tol){
  const px=wandPixels(im); if(!px) return null;
  const sx=clamp(Math.round(fx*px.w),0,px.w-1);
  const sy=clamp(Math.round(fy*px.h),0,px.h-1);
  let mask=floodMask(px,sx,sy,tol);
  mask=fillPinholes(mask,px.w,px.h);
  mask=keepBlob(mask,px.w,px.h,sx,sy);

  let n=0; for(let i=0;i<mask.length;i++) n+=mask[i];
  if(n<12) return null;                       /* 너무 작다 */
  const share=n/(px.w*px.h);

  const raw=traceContour(mask,px.w,px.h);
  if(!raw) return null;
  const pts=simplify(raw,1.1);
  if(pts.length<3) return null;

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of pts){
    if(x<x0)x0=x; if(y<y0)y0=y;
    if(x>x1)x1=x; if(y>y1)y1=y;
  }
  const bw=Math.max(1,x1-x0), bh=Math.max(1,y1-y0);
  return {
    /* 사진 전체 기준 경계상자 (0~1) — 기존 형식 그대로 */
    x:x0/px.w, y:y0/px.h, w:bw/px.w, h:bh/px.h,
    /* 경계상자 기준 다각형 (0~100 %) — clip-path 로 그린다 */
    path:pts.map(([x,y])=>[
      +(((x-x0)/bw)*100).toFixed(2),
      +(((y-y0)/bh)*100).toFixed(2)]),
    share:share
  };
}
function pathToClip(path){
  return "polygon("+path.map(p=>p[0]+"% "+p[1]+"%").join(",")+")";
}

/* ══ 사진에서 색 읽기 ══════════════════════════════════════
   기기 안에서만 돈다. 사진은 어디로도 나가지 않는다.

   할 수 있는 것: 주된 색, 전체 색온도(따뜻함/서늘함), 밝기
   할 수 없는 것: 사물·재질·구조 (아치, 라임스톤, 고요함 …)
                 그건 장면을 이해해야 하는 일이라 색 분석으로는 불가능하다.
   결과는 메모리에만 둔다 — 백업 형식을 건드리지 않기 위해서. */
const AUTO = new Map(); // item.id -> [{name,cat,hex}]

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
const hex2 = n => ("0" + Math.round(clamp(n,0,255)).toString(16)).slice(-2);
const toHex = c => "#" + hex2(c[0]) + hex2(c[1]) + hex2(c[2]);

/* 색 하나에 이름을 붙인다. 이 앱이 쓰는 어휘에 맞춰 골랐다. */
function nameColor(h, s, l, chroma) {
  /* 아주 밝거나 어두운 색에서는 HSL 채도가 불안정하다.
     (245,244,236) 같은 오프화이트가 채도 31% 로 튀어 "머스타드"가 되어버린다.
     그래서 무채색 판정은 실제 채도(max-min)로 한다. */
  if (chroma <= 20) {
    if (l >= 84) return "오프화이트";
    if (l <= 19) return "먹색";
    return l >= 62 ? "연회색" : l >= 33 ? "중간 회색" : "짙은 회색";
  }
  if (l >= 90) return "오프화이트";
  if (l <= 14) return "먹색";
  if (h < 15 || h >= 345) return l < 40 ? "적갈" : "벽돌빛";
  if (h < 33) return (l >= 60 && s <= 45) ? "뉴트럴 베이지" : "테라코타";
  if (h < 48) return (l >= 68 && s <= 42) ? "뉴트럴 베이지" : (l >= 46 ? "머스타드" : "황토");
  if (h < 72) return l < 56 ? "올리브" : "머스타드";
  if (h < 100) return l < 48 ? "올리브" : "연둣빛";
  if (h < 155) return l < 44 ? "딥그린" : "초록";
  if (h < 196) return "청록";
  if (h < 238) return l < 42 ? "네이비" : "하늘빛";
  if (h < 272) return "푸른 보라";
  if (h < 302) return "보라";
  return "자주";
}

/* k-means 로 주된 색 몇 개를 뽑는다 */
function dominant(px, k, iters) {
  const n = px.length / 3;
  const cen = [];
  for (let i = 0; i < k; i++) {
    const j = Math.floor((i + 0.5) * n / k) * 3;
    cen.push([px[j], px[j + 1], px[j + 2]]);
  }
  const who = new Int32Array(n);
  for (let it = 0; it < iters; it++) {
    for (let i = 0; i < n; i++) {
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const dr = px[i*3] - cen[c][0], dg = px[i*3+1] - cen[c][1], db = px[i*3+2] - cen[c][2];
        const d = dr*dr + dg*dg + db*db;
        if (d < bd) { bd = d; best = c; }
      }
      who[i] = best;
    }
    const sum = Array.from({length:k}, () => [0,0,0,0]);
    for (let i = 0; i < n; i++) {
      const c = who[i], s = sum[c];
      s[0] += px[i*3]; s[1] += px[i*3+1]; s[2] += px[i*3+2]; s[3]++;
    }
    for (let c = 0; c < k; c++) {
      if (sum[c][3]) cen[c] = [sum[c][0]/sum[c][3], sum[c][1]/sum[c][3], sum[c][2]/sum[c][3]];
    }
  }
  const cnt = new Array(k).fill(0);
  for (let i = 0; i < n; i++) cnt[who[i]]++;
  return cen.map((c, i) => ({ rgb: c, share: cnt[i] / n }))
            .sort((a, b) => b.share - a.share);
}

function analyzeImage(im) {
  const N = 64;
  const cv = document.createElement("canvas");
  cv.width = cv.height = N;
  const g = cv.getContext("2d", { willReadFrequently: true });
  let data;
  try {
    g.drawImage(im, 0, 0, N, N);
    data = g.getImageData(0, 0, N, N).data;
  } catch (e) { return []; } // 캔버스가 오염된 경우 조용히 포기
  const px = new Float64Array(N * N * 3);
  for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
    px[j] = data[i]; px[j+1] = data[i+1]; px[j+2] = data[i+2];
  }

  const out = [];
  const seen = new Set();

  // ── 주된 색 (점유율이 충분한 것만)
  for (const c of dominant(px, 5, 8)) {
    if (c.share < 0.09) continue;
    const [h, s, l] = rgb2hsl(c.rgb[0], c.rgb[1], c.rgb[2]);
    const ch = Math.max(c.rgb[0],c.rgb[1],c.rgb[2]) - Math.min(c.rgb[0],c.rgb[1],c.rgb[2]);
    const name = nameColor(h, s, l, ch);
    if (seen.has(name)) continue;
    seen.add(name);
    out.push({ name, cat: "color", hex: toHex(c.rgb) });
    if (out.length >= 3) break;
  }

  // ── 전체 통계에서 색온도와 밝기
  let sumL = 0, warm = 0, cool = 0, wsum = 0;
  const n = N * N;
  for (let i = 0; i < n; i++) {
    const r0 = px[i*3], g0 = px[i*3+1], b0 = px[i*3+2];
    const [h, s, l] = rgb2hsl(r0, g0, b0);
    sumL += l;
    const ch = Math.max(r0,g0,b0) - Math.min(r0,g0,b0);
    if (ch > 20) {          // 채도가 뚜렷한 픽셀만 색온도 판단에 쓴다
      const w = s / 100;
      wsum += w;
      if (h < 65 || h >= 330) warm += w;
      else if (h >= 175 && h < 265) cool += w;
    }
  }
  const meanL = sumL / n;
  if (wsum > n * 0.05) {
    const wr = warm / wsum, cr = cool / wsum;
    if (wr > 0.45 && wr > cr * 2) out.push({ name: "따뜻함", cat: "mood" });
    else if (cr > 0.40 && cr > wr * 2) out.push({ name: "서늘함", cat: "mood" });
  }
  if (meanL >= 68) out.push({ name: "밝음", cat: "light" });
  else if (meanL <= 32) out.push({ name: "어둑함", cat: "light" });

  return out;
}

function ensureAuto(it, im) {
  if (!it || AUTO.has(it.id)) return false;
  const res = analyzeImage(im);
  AUTO.set(it.id, res);
  return true;
}

function TagField(host,getIds,setIds,placeholder){
  host.innerHTML='<div class="sugs"><div class="tagfield"></div><div class="sugbox" hidden></div></div>';
  const field=host.querySelector(".tagfield"), sugbox=host.querySelector(".sugbox");
  const input=document.createElement("input");
  input.type="text"; input.placeholder=placeholder||"태그 입력"; input.autocomplete="off";
  let cursor=-1, rows=[];

  function paint(){
    Array.prototype.slice.call(field.querySelectorAll(".chip")).forEach(n=>n.remove());
    const ids=getIds();
    ids.forEach(id=>{
      const t=tagById(id); if(!t) return;
      const chip=document.createElement("span");
      chip.className="chip";
      chip.innerHTML='<i class="dot" style="background:var('+CATMAP[t.cat].v+')"></i>'+esc(t.name)+'<button class="x" title="빼기">'+ICON_X+'</button>';
      chip.querySelector(".x").addEventListener("click",e=>{
        e.stopPropagation();
        setIds(getIds().filter(x=>x!==id)); paint(); afterChange();
      });
      field.insertBefore(chip,input);
    });
  }
  function afterChange(){ pruneTags(); save(CUR); renderRail(); renderArchive(); graphDirty(); }

  function commit(name,cat){
    const t=ensureTag(name,cat); if(!t) return;
    const ids=getIds();
    if(ids.indexOf(t.id)<0) setIds(ids.concat([t.id]));
    input.value=""; paint(); hide(); afterChange();
  }
  function hide(){ sugbox.hidden=true; sugbox.innerHTML=""; rows=[]; cursor=-1; }

  function show(){
    const q=input.value.trim().toLowerCase();
    const has=new Set(getIds());
    const out=[];
    ST.tags.filter(t=>!has.has(t.id)&&(!q||t.name.toLowerCase().indexOf(q)>=0))
      .sort((a,b)=>tagCount(b.id)-tagCount(a.id)||a.name.localeCompare(b.name,"ko"))
      .slice(0,8).forEach(t=>out.push({kind:"tag",tag:t}));
    CATS.forEach(c=>c.sug.forEach(s=>{
      if(out.length>=13) return;
      if(q&&s.toLowerCase().indexOf(q)<0) return;
      if(tagByName(s)) return;
      out.push({kind:"sug",name:s,cat:c.id});
    }));
    const exact=q&&!ST.tags.some(t=>t.name.toLowerCase()===q)&&!out.some(o=>o.kind==="sug"&&o.name.toLowerCase()===q);
    if(exact) out.unshift({kind:"new",name:input.value.trim()});
    if(!out.length){ hide(); return; }
    rows=out;
    sugbox.innerHTML=out.map((o,i)=>{
      if(o.kind==="tag") return '<button data-i="'+i+'"><i class="dot" style="background:var('+CATMAP[o.tag.cat].v+')"></i>'+esc(o.tag.name)+'<span class="k">'+tagCount(o.tag.id)+'</span></button>';
      if(o.kind==="sug") return '<button data-i="'+i+'"><i class="dot" style="background:var('+CATMAP[o.cat].v+')"></i>'+esc(o.name)+'<span class="k">'+esc(CATMAP[o.cat].name)+'</span></button>';
      return '<button data-i="'+i+'"><i class="dot" style="background:var(--c-etc)"></i>‘'+esc(o.name)+'’ 새로 만들기<span class="k">'+
        CATS.map(c=>'<i class="dot catpick" data-cat="'+c.id+'" title="'+esc(c.name)+'" style="background:var('+c.v+');width:8px;height:8px;display:inline-block;margin-left:3px;border-radius:50%;cursor:pointer"></i>').join("")+'</span></button>';
    }).join("");
    sugbox.hidden=false;
    Array.prototype.slice.call(sugbox.querySelectorAll("button")).forEach(b=>{
      b.addEventListener("mousedown",e=>{
        e.preventDefault();
        const pick=e.target.closest?e.target.closest(".catpick"):null;
        const o=rows[+b.dataset.i];
        if(pick&&o.kind==="new"){ commit(o.name,pick.dataset.cat); return; }
        if(o.kind==="tag") commit(o.tag.name,o.tag.cat);
        else if(o.kind==="sug") commit(o.name,o.cat);
        else commit(o.name);
      });
    });
  }
  function move(d){
    if(sugbox.hidden) return;
    const bs=sugbox.querySelectorAll("button");
    if(!bs.length) return;
    cursor=(cursor+d+bs.length)%bs.length;
    Array.prototype.slice.call(bs).forEach((b,i)=>b.classList.toggle("on",i===cursor));
    bs[cursor].scrollIntoView({block:"nearest"});
  }
  input.addEventListener("input",show);
  input.addEventListener("focus",show);
  input.addEventListener("blur",()=>setTimeout(hide,90));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();move(1);}
    else if(e.key==="ArrowUp"){e.preventDefault();move(-1);}
    else if(e.key==="Enter"){
      e.preventDefault();
      if(cursor>=0&&rows[cursor]){
        const o=rows[cursor];
        commit(o.kind==="tag"?o.tag.name:o.name, o.kind==="tag"?o.tag.cat:(o.cat||null));
      }else if(input.value.trim()) commit(input.value.trim());
    }else if(e.key==="Escape"){ if(!sugbox.hidden){e.stopPropagation();hide();} }
    else if(e.key==="Backspace"&&!input.value){
      const ids=getIds(); if(ids.length){ setIds(ids.slice(0,-1)); paint(); afterChange(); }
    }
  });
  field.addEventListener("click",()=>input.focus());
  field.appendChild(input);
  paint();
  return {paint:paint,focus:()=>input.focus(),commit:commit};
}

/* ══ 상세 화면 ════════════════════════════════════════ */
let CUR=null, SEL=null, DRAW=false, sheetEl=null;
let TOOL="rect";    /* rect = 드래그해서 네모, wand = 눌러서 면 자동 선택 */
let WANDSEL=null;   /* 미리보기 중인 자동 선택 결과 */
/* 아래 셋은 wireSheet 안에서 채워진다 (레이어 요소가 그때 생기므로) */
let runWand=()=>{}, clearWand=()=>{}, commitWand=()=>{};

function sheetHTML(){
  return '<div class="sheet-bar">'+
    '<button class="icon-btn" id="shClose" title="닫기 (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg></button>'+
    '<span class="lbl" id="shPos"></span>'+
    '<div style="flex:1"></div>'+
    '<span class="lbl only-desktop" style="margin-right:2px">좋아하는 부분</span>'+
    '<div class="switch sm" id="shTools" role="tablist" aria-label="부분 표시 방법">'+
      '<button role="tab" data-tool="rect" aria-selected="false" title="드래그해서 네모로">네모로</button>'+
      '<button role="tab" data-tool="wand" aria-selected="false" title="누른 곳의 면을 자동으로">자동으로</button>'+
    '</div>'+
    '<button class="icon-btn" id="shPrev" title="이전 (←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg></button>'+
    '<button class="icon-btn" id="shNext" title="다음 (→)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 11 8l-4.5 4.5"/></svg></button>'+
    '<button class="icon-btn" id="shDel" title="이 사진 지우기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8h4.8l.6-8"/></svg></button>'+
  '</div>'+
  '<div class="stage" id="stage"><div class="frame" id="frame"><img id="shImg" alt=""><div class="layer" id="layer"></div></div>'+
    '<div class="stage-hint" id="hint" hidden></div>'+
    '<div class="wandbar" id="wandbar" hidden>'+
      '<span class="lbl">잡는 범위</span>'+
      '<input class="slider" type="range" id="wandTol" min="12" max="110" step="2" value="42">'+
      '<span class="lbl mono" id="wandInfo"></span>'+
      '<button class="btn" id="wandCancel">취소</button>'+
      '<button class="btn primary" id="wandOk">이대로 담기</button>'+
    '</div></div>'+
  '<aside class="panel" id="panel">'+
    '<div class="grp"><textarea class="ttl" id="pTitle" rows="1" placeholder="제목 없음"></textarea>'+
      '<div class="date mono" id="pDate"></div></div>'+
    '<div class="grp"><h3><span class="lbl">공간</span></h3><div id="pSpace"></div></div>'+
    '<div class="grp"><h3><span class="lbl">태그</span></h3><div id="pTags"></div>'+
      '<div id="pAuto" class="autobox" hidden></div></div>'+
    '<div class="grp"><h3><span class="lbl">한 줄 인상</span></h3>'+
      '<textarea class="note" id="pNote" placeholder="이 장면이 왜 마음에 들었는지"></textarea></div>'+
    '<div class="grp"><h3><span class="lbl">좋아하는 부분</span><span class="lbl" id="pRgN"></span></h3>'+
      '<div id="pRegions"></div></div>'+
    '<div class="grp"><h3><span class="lbl">어울리는 것</span></h3><div class="thumbs" id="pLinks"></div></div>'+
  '</aside>';
}

function openItem(id,focusRegion){
  const it=ST.items.find(x=>x.id===id); if(!it) return;
  CUR=it; SEL=focusRegion||null;
  if(!sheetEl){
    sheetEl=document.createElement("div");
    sheetEl.className="sheet";
    sheetEl.innerHTML=sheetHTML();
    document.body.appendChild(sheetEl);
    wireSheet();
  }
  sheetEl.hidden=false;
  document.body.style.overflow="hidden";
  const img=sheetEl.querySelector("#shImg");
  img.src=urlFor(it.img&&it.img.key);
  img.style.width="100%"; img.style.height="100%";
  /* 사진이 준비되면 색을 읽어 태그 후보를 만든다 (기기 안에서만) */
  const runAuto=()=>{ try{ if(ensureAuto(it,img)&&CUR===it) renderAuto(); }catch(e){ console.warn(e); } };
  if(img.complete&&img.naturalWidth) runAuto();
  else img.addEventListener("load",runAuto,{once:true});
  DRAW=(it.regions||[]).length===0;
  fitFrame(); renderPanel(); renderRegions(); updateDrawUI();
  if(SEL) selectRegion(SEL,true);
  const idx=filtered().findIndex(x=>x.id===id);
  const tot=filtered().length;
  sheetEl.querySelector("#shPos").textContent = idx>=0? (idx+1)+" / "+tot : "";
}
function closeSheet(){
  if(!sheetEl) return;
  sheetEl.hidden=true; CUR=null; SEL=null;
  document.body.style.overflow="";
  renderAll();
}
function stepItem(d){
  if(!CUR) return;
  const list=filtered();
  const i=list.findIndex(x=>x.id===CUR.id);
  if(i<0) return;
  const n=list[(i+d+list.length)%list.length];
  if(n) openItem(n.id);
}
function fitFrame(){
  if(!sheetEl||!CUR) return;
  const stage=sheetEl.querySelector("#stage"), frame=sheetEl.querySelector("#frame");
  const cs=getComputedStyle(stage);
  const availW=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const w=(CUR.img&&CUR.img.w)||3, h=(CUR.img&&CUR.img.h)||2;
  if(availW<=0||availH<=0) return;
  const s=Math.min(availW/w,availH/h);
  frame.style.width=Math.max(40,Math.round(w*s))+"px";
  frame.style.height=Math.max(40,Math.round(h*s))+"px";
}
function updateDrawUI(){
  if(!sheetEl) return;
  const layer=sheetEl.querySelector("#layer"), hint=sheetEl.querySelector("#hint");
  layer.classList.toggle("draw",DRAW&&TOOL==="rect");
  layer.classList.toggle("wand",DRAW&&TOOL==="wand");
  sheetEl.querySelectorAll("#shTools button").forEach(b=>
    b.setAttribute("aria-selected",(DRAW&&b.dataset.tool===TOOL)?"true":"false"));
  if(DRAW){
    hint.hidden=!!WANDSEL;
    hint.textContent = TOOL==="wand"
      ? "담고 싶은 면을 눌러보세요 — 색이 이어지는 만큼 잡습니다"
      : "좋았던 부분을 드래그해서 감싸주세요";
  }else if(SEL){
    hint.hidden=false;
    hint.textContent="모서리를 끌면 크기 조절 · 안쪽을 끌면 이동";
  }else hint.hidden=true;
}
let PTAGS=null;
function renderPanel(){
  if(!CUR) return;
  const t=sheetEl.querySelector("#pTitle");
  t.value=CUR.title||""; autoGrow(t);
  sheetEl.querySelector("#pDate").textContent=fmtDate(CUR.createdAt);
  const n=sheetEl.querySelector("#pNote");
  n.value=CUR.note||""; autoGrow(n);
  PTAGS=TagField(sheetEl.querySelector("#pTags"),()=>CUR.tags||[],ids=>{CUR.tags=ids;},"색, 소재, 분위기…");
  renderAuto();
  renderSpacePick();
  renderLinks();
}

/* 이 사진이 어느 공간에 속하는지 고른다. 같은 자리를 여러 각도로 찍었을 때 묶인다. */
function renderSpacePick(){
  if(!sheetEl||!CUR) return;
  const box=sheetEl.querySelector("#pSpace");
  const list=(ST.spaces||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  const cur=CUR.space?spaceById(CUR.space):null;
  box.innerHTML=
    '<select class="spsel" id="spSel">'+
      '<option value="">묶지 않음</option>'+
      list.map(sp=>'<option value="'+sp.id+'"'+(cur&&cur.id===sp.id?' selected':'')+'>'+esc(sp.name)+'</option>').join("")+
      '<option value="__new">+ 새 공간 만들기…</option>'+
    '</select>'+
    '<div class="spnew" id="spNew" hidden>'+
      '<input id="spNewName" placeholder="공간 이름 (예: 성수동 카페 A)">'+
      '<button class="btn" id="spNewOk">만들기</button>'+
    '</div>'+
    (cur?'<button class="btn ghost spgo" data-gospace="'+cur.id+'">이 공간 열기 ('+spaceItems(cur.id).length+'장)</button>':"");

  const sel=box.querySelector("#spSel"), nb=box.querySelector("#spNew");
  sel.addEventListener("change",()=>{
    if(sel.value==="__new"){ nb.hidden=false; box.querySelector("#spNewName").focus(); return; }
    nb.hidden=true;
    setItemSpace(sel.value||null);
  });
  const mk=()=>{
    const name=box.querySelector("#spNewName").value.trim();
    if(!name){ toast("이름을 적어주세요.",true); return; }
    const sp=ensureSpace(name);
    setItemSpace(sp?sp.id:null);
    saveSpaces();
  };
  box.querySelector("#spNewOk").addEventListener("click",mk);
  box.querySelector("#spNewName").addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); mk(); }
  });
  const go=box.querySelector("[data-gospace]");
  if(go) go.addEventListener("click",()=>{
    INSPACE=go.dataset.gospace; closeSheet(); setView("archive"); renderArchive();
  });
}
function setItemSpace(id){
  CUR.space=id||null;
  CUR.updatedAt=Date.now();
  save(CUR); pruneSpaces();
  renderSpacePick(); renderArchive(); graphDirty();
}

/* 사진에서 읽어낸 색을 태그 후보로 보여준다. 누르면 태그가 된다. */
function renderAuto(){
  if(!sheetEl||!CUR) return;
  const box=sheetEl.querySelector("#pAuto");
  const list=AUTO.get(CUR.id);
  if(!list||!list.length){ box.hidden=true; box.innerHTML=""; return; }
  const have=new Set((CUR.tags||[]).map(id=>{const t=tagById(id);return t?t.name:"";}));
  const rest=list.filter(s=>!have.has(s.name));
  if(!rest.length){ box.hidden=true; box.innerHTML=""; return; }
  box.hidden=false;
  box.innerHTML='<div class="autohead"><span class="lbl">사진의 색에서</span></div>'+
    '<div class="autolist">'+rest.map(s=>
      '<button class="tg" data-auto="'+esc(s.name)+'" data-autocat="'+esc(s.cat)+'">'+
      (s.hex? '<i class="sw" style="background:'+esc(s.hex)+'"></i>'
            : '<i class="dot" style="background:var('+CATMAP[s.cat].v+')"></i>')+
      esc(s.name)+'</button>').join("")+'</div>';
  box.querySelectorAll("[data-auto]").forEach(b=>{
    b.addEventListener("click",()=>{
      if(PTAGS) PTAGS.commit(b.dataset.auto,b.dataset.autocat);
      renderAuto();
    });
  });
}
function renderLinks(){
  const box=sheetEl.querySelector("#pLinks");
  const links=(CUR.links||[]).map(id=>ST.items.find(x=>x.id===id)).filter(Boolean);
  box.innerHTML=links.map(o=>'<div class="thumb" data-goto="'+o.id+'" title="'+esc(o.title||"제목 없음")+'"><img src="'+urlFor(o.img&&o.img.key)+'" alt=""><button class="x" data-unlink="'+o.id+'" title="연결 끊기">'+ICON_X+'</button></div>').join("")+
    '<button class="thumb add" id="addLink" title="어울리는 사진 고르기">+</button>';
}
const HANDLES=["nw","n","ne","e","se","s","sw","w"]
  .map(h=>'<i class="h" data-h="'+h+'"></i>').join("");

function regionHTML(r,i){
  return '<div class="rgitem" data-rg="'+r.id+'">'+
    '<div class="top"><span class="num">'+(i+1)+'</span><span class="lbl" style="letter-spacing:.1em">부분 메모</span>'+
    '<button class="rgpin'+(boardHas(boardById(CURBOARD)||(ST.boards||[])[0],CUR?CUR.id:"",r.id)?" on":"")+'" data-pinadd="'+(CUR?CUR.id:"")+'" data-pinrg="'+r.id+'" title="무드보드에 담기">'+ICON_PIN+'</button>'+
    '<button class="del" data-delrg="'+r.id+'" title="지우기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8h4.8l.6-8"/></svg></button></div>'+
    '<textarea rows="1" data-rgtext="'+r.id+'" placeholder="여기가 왜 좋은지 적어두기"></textarea>'+
    '<div style="margin-top:7px" data-rgtags="'+r.id+'"></div></div>';
}
function renderRegions(){
  if(!CUR) return;
  const layer=sheetEl.querySelector("#layer");
  const rs=CUR.regions||[];
  layer.innerHTML=rs.map((r,i)=>{
    const clip=(r.path&&r.path.length>2)?';clip-path:'+pathToClip(r.path):'';
    return '<div class="rg'+(SEL===r.id?" on":"")+(clip?" poly":"")+'" data-rg="'+r.id+'"'+
      ' style="left:'+(r.x*100)+'%;top:'+(r.y*100)+'%;width:'+(r.w*100)+'%;height:'+(r.h*100)+'%'+clip+'">'+
      '<span class="num">'+(i+1)+'</span>'+HANDLES+'</div>';
  }).join("");
  const box=sheetEl.querySelector("#pRegions");
  sheetEl.querySelector("#pRgN").textContent=rs.length?rs.length+"개":"";
  if(!rs.length){
    box.innerHTML='<p style="color:var(--muted);font-size:12.5px;line-height:1.75;margin:0">아직 표시한 부분이 없어요. 위 <b style="font-weight:500;color:var(--ink-2)">좋아하는 부분 표시</b>를 켜고 사진 위를 드래그해 보세요.</p>';
    return;
  }
  box.innerHTML=rs.map(regionHTML).join("");
  rs.forEach(r=>{
    const ta=box.querySelector('[data-rgtext="'+r.id+'"]');
    ta.value=r.text||""; autoGrow(ta);
    ta.addEventListener("input",()=>{r.text=ta.value;autoGrow(ta);save(CUR);});
    ta.addEventListener("focus",()=>selectRegion(r.id,false));
    TagField(box.querySelector('[data-rgtags="'+r.id+'"]'),()=>r.tags||[],ids=>{r.tags=ids;},"이 부분의 태그");
  });
  box.querySelectorAll(".rgitem").forEach(el=>{
    el.addEventListener("mouseenter",()=>hoverRegion(el.dataset.rg,true));
    el.addEventListener("mouseleave",()=>hoverRegion(el.dataset.rg,false));
    el.addEventListener("click",e=>{ if(!e.target.closest("button")) selectRegion(el.dataset.rg,false); });
  });
  box.querySelectorAll("[data-pinadd]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); handlePinClick(b);
  }));
  box.querySelectorAll("[data-delrg]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    CUR.regions=CUR.regions.filter(x=>x.id!==b.dataset.delrg);
    if(SEL===b.dataset.delrg) SEL=null;
    pruneTags(); save(CUR); renderRegions(); renderRail(); graphDirty();
  }));
  box.querySelectorAll(".rgitem").forEach(el=>{ if(el.dataset.rg===SEL) el.classList.add("on"); });
}
function hoverRegion(id,on){
  if(!sheetEl) return;
  const el=sheetEl.querySelector('.layer .rg[data-rg="'+id+'"]');
  if(el) el.classList.toggle("on",on||SEL===id);
}
function selectRegion(id,scroll){
  SEL=id;
  sheetEl.querySelectorAll(".layer .rg").forEach(el=>el.classList.toggle("on",el.dataset.rg===id));
  sheetEl.querySelectorAll(".rgitem").forEach(el=>el.classList.toggle("on",el.dataset.rg===id));
  if(scroll){
    const el=sheetEl.querySelector('.rgitem[data-rg="'+id+'"]');
    if(el) el.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  updateDrawUI();   /* 고른 영역이 있으면 "끌어서 고치기" 안내를 띄운다 */
}

function wireSheet(){
  const layer=sheetEl.querySelector("#layer");
  sheetEl.querySelector("#shClose").addEventListener("click",closeSheet);
  sheetEl.querySelector("#shPrev").addEventListener("click",()=>stepItem(-1));
  sheetEl.querySelector("#shNext").addEventListener("click",()=>stepItem(1));
  sheetEl.querySelectorAll("#shTools button").forEach(b=>{
    b.addEventListener("click",()=>{
      const t=b.dataset.tool;
      if(DRAW&&TOOL===t){ DRAW=false; }        /* 같은 걸 또 누르면 끈다 */
      else { DRAW=true; TOOL=t; }
      clearWand();
      updateDrawUI();
    });
  });
  sheetEl.querySelector("#wandTol").addEventListener("input",()=>runWand());
  sheetEl.querySelector("#wandCancel").addEventListener("click",()=>{ clearWand(); updateDrawUI(); });
  sheetEl.querySelector("#wandOk").addEventListener("click",()=>commitWand());
  sheetEl.querySelector("#shDel").addEventListener("click",()=>{
    if(!CUR) return;
    const id=CUR.id;
    if(confirm("이 사진과 메모를 모두 지울까요?")){ closeSheet(); deleteItem(id); }
  });
  const t=sheetEl.querySelector("#pTitle");
  t.addEventListener("input",()=>{CUR.title=t.value.replace(/\n/g,"");autoGrow(t);save(CUR);});
  t.addEventListener("keydown",e=>{if(e.key==="Enter")e.preventDefault();});
  const n=sheetEl.querySelector("#pNote");
  n.addEventListener("input",()=>{CUR.note=n.value;autoGrow(n);save(CUR);});

  sheetEl.querySelector("#pLinks").addEventListener("click",e=>{
    const un=e.target.closest("[data-unlink]");
    if(un){ e.stopPropagation();
      const oid=un.dataset.unlink;
      CUR.links=(CUR.links||[]).filter(x=>x!==oid);
      const other=ST.items.find(x=>x.id===oid);
      if(other) other.links=(other.links||[]).filter(x=>x!==CUR.id);
      save(); renderLinks(); graphDirty(); return; }
    if(e.target.closest("#addLink")){ openLinkPicker(); return; }
    const go=e.target.closest("[data-goto]");
    if(go) openItem(go.dataset.goto);
  });

  /* ── 마술봉: 누른 면을 미리 보여주고, 범위를 조절해 담는다 ── */
  let wandAt=null;   /* 마지막으로 누른 지점 (0~1) */
  runWand=()=>{
    if(!wandAt||!CUR) return;
    const im=sheetEl.querySelector("#shImg");
    const tol=+sheetEl.querySelector("#wandTol").value;
    const res=wandSelect(im,wandAt.x,wandAt.y,tol);
    const bar=sheetEl.querySelector("#wandbar");
    const info=sheetEl.querySelector("#wandInfo");
    let prev=layer.querySelector(".rg.preview");
    if(!res){
      WANDSEL=null;
      if(prev) prev.remove();
      info.textContent="잡히지 않음";
      bar.hidden=false;
      return;
    }
    WANDSEL=res;
    if(!prev){
      prev=document.createElement("div");
      prev.className="rg preview";
      layer.appendChild(prev);
    }
    prev.style.left=res.x*100+"%"; prev.style.top=res.y*100+"%";
    prev.style.width=res.w*100+"%"; prev.style.height=res.h*100+"%";
    prev.style.clipPath=pathToClip(res.path);
    info.textContent=Math.round(res.share*100)+"%";
    bar.hidden=false;
    hintOff();
  };
  clearWand=()=>{
    WANDSEL=null; wandAt=null;
    const prev=layer.querySelector(".rg.preview"); if(prev) prev.remove();
    const bar=sheetEl&&sheetEl.querySelector("#wandbar"); if(bar) bar.hidden=true;
  };
  commitWand=()=>{
    if(!WANDSEL||!CUR) return;
    const r=WANDSEL;
    const rg={id:uid("r"),
      x:+r.x.toFixed(4),y:+r.y.toFixed(4),w:+r.w.toFixed(4),h:+r.h.toFixed(4),
      path:r.path, text:"", tags:[]};
    CUR.regions=(CUR.regions||[]).concat([rg]);
    SEL=rg.id; DRAW=false;
    clearWand();
    save(CUR); renderRegions(); updateDrawUI(); graphDirty();
    const ta=sheetEl.querySelector('[data-rgtext="'+rg.id+'"]');
    if(ta){ ta.scrollIntoView({block:"nearest"}); ta.focus(); }
  };
  function hintOff(){ const h=sheetEl.querySelector("#hint"); if(h) h.hidden=true; }

  /* 영역 드래그 */
  let start=null, mq=null;

  /* ── 만들어둔 영역 고치기 (이동·크기 조절) ────────────────
     예전에는 한 번 그리면 좌표를 바꿀 방법이 아예 없었다. */
  const MINSIZE=0.02;
  let edit=null;
  function applyBox(el,b){
    el.style.left=b.x*100+"%"; el.style.top=b.y*100+"%";
    el.style.width=b.w*100+"%"; el.style.height=b.h*100+"%";
  }
  function beginEdit(e,el,mode){
    if(e.button!==undefined&&e.button!==0) return;
    const r=(CUR.regions||[]).find(x=>x.id===el.dataset.rg);
    if(!r) return;
    const box=layer.getBoundingClientRect();
    if(!box.width||!box.height) return;
    try{ layer.setPointerCapture(e.pointerId); }catch(_){}
    edit={r:r,el:el,mode:mode,box:box,cur:null,
      sx:(e.clientX-box.left)/box.width, sy:(e.clientY-box.top)/box.height,
      ox:r.x, oy:r.y, ow:r.w, oh:r.h};
    el.classList.add("editing");
    e.preventDefault(); e.stopPropagation();
  }
  function dragEdit(e){
    const b=edit.box, m=edit.mode;
    const cx=clamp((e.clientX-b.left)/b.width,0,1);
    const cy=clamp((e.clientY-b.top)/b.height,0,1);
    const dx=cx-edit.sx, dy=cy-edit.sy;
    let x=edit.ox, y=edit.oy, w=edit.ow, h=edit.oh;
    if(m==="move"){
      x=clamp(edit.ox+dx,0,1-edit.ow);
      y=clamp(edit.oy+dy,0,1-edit.oh);
    }else{
      if(m.indexOf("w")>=0){ const nx=clamp(edit.ox+dx,0,edit.ox+edit.ow-MINSIZE); w=edit.ox+edit.ow-nx; x=nx; }
      if(m.indexOf("e")>=0){ w=clamp(edit.ow+dx,MINSIZE,1-edit.ox); }
      if(m.indexOf("n")>=0){ const ny=clamp(edit.oy+dy,0,edit.oy+edit.oh-MINSIZE); h=edit.oy+edit.oh-ny; y=ny; }
      if(m.indexOf("s")>=0){ h=clamp(edit.oh+dy,MINSIZE,1-edit.oy); }
    }
    edit.cur={x:x,y:y,w:w,h:h};
    applyBox(edit.el,edit.cur);
  }
  function endEdit(e){
    const c=edit.cur, r=edit.r;
    edit.el.classList.remove("editing");
    try{ layer.releasePointerCapture(e.pointerId); }catch(_){}
    edit=null;
    if(c){
      r.x=+c.x.toFixed(4); r.y=+c.y.toFixed(4);
      r.w=+c.w.toFixed(4); r.h=+c.h.toFixed(4);
      save(CUR); graphDirty();
    }
    renderRegions();
  }
  layer.addEventListener("pointerdown",e=>{
    if(!DRAW){
      const hit=e.target.closest(".rg");
      if(hit){
        /* 이미 고른 영역이면 손잡이로 크기 조절, 안쪽을 끌면 이동 */
        if(hit.dataset.rg===SEL){
          const handle=e.target.closest(".h");
          beginEdit(e,hit,handle?handle.dataset.h:"move");
        }else selectRegion(hit.dataset.rg,true);
      }
      else { SEL=null; renderRegions(); updateDrawUI(); }
      return;
    }
    if(e.button!==0) return;
    const box=layer.getBoundingClientRect();
    if(TOOL==="wand"){
      wandAt={x:clamp((e.clientX-box.left)/box.width,0,1),
              y:clamp((e.clientY-box.top)/box.height,0,1)};
      runWand();
      e.preventDefault();
      return;
    }
    layer.setPointerCapture(e.pointerId);
    const r=box;
    start={x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)};
    mq=document.createElement("div"); mq.className="marquee"; layer.appendChild(mq);
    e.preventDefault();
  });
  layer.addEventListener("pointermove",e=>{
    if(edit){ dragEdit(e); return; }
    if(!start||!mq) return;
    const r=layer.getBoundingClientRect();
    const x=clamp((e.clientX-r.left)/r.width,0,1), y=clamp((e.clientY-r.top)/r.height,0,1);
    const box={x:Math.min(x,start.x),y:Math.min(y,start.y),w:Math.abs(x-start.x),h:Math.abs(y-start.y)};
    mq.style.left=box.x*100+"%"; mq.style.top=box.y*100+"%";
    mq.style.width=box.w*100+"%"; mq.style.height=box.h*100+"%";
  });
  layer.addEventListener("pointerup",e=>{
    if(edit){ endEdit(e); return; }
    if(!start||!mq) return;
    const r=layer.getBoundingClientRect();
    const x=clamp((e.clientX-r.left)/r.width,0,1), y=clamp((e.clientY-r.top)/r.height,0,1);
    const box={x:Math.min(x,start.x),y:Math.min(y,start.y),w:Math.abs(x-start.x),h:Math.abs(y-start.y)};
    mq.remove(); mq=null; start=null;
    try{ layer.releasePointerCapture(e.pointerId); }catch(_){}
    if(box.w<0.02||box.h<0.02) return;
    const rg={id:uid("r"),x:+box.x.toFixed(4),y:+box.y.toFixed(4),w:+box.w.toFixed(4),h:+box.h.toFixed(4),text:"",tags:[]};
    CUR.regions=(CUR.regions||[]).concat([rg]);
    SEL=rg.id; DRAW=false; updateDrawUI();
    save(CUR); renderRegions(); graphDirty();
    const ta=sheetEl.querySelector('[data-rgtext="'+rg.id+'"]');
    if(ta){ ta.scrollIntoView({block:"nearest"}); ta.focus(); }
  });
  layer.addEventListener("mouseover",e=>{
    const hit=e.target.closest(".rg"); if(!hit) return;
    const el=sheetEl.querySelector('.rgitem[data-rg="'+hit.dataset.rg+'"]');
    if(el) el.classList.add("on");
  });
  layer.addEventListener("mouseout",e=>{
    const hit=e.target.closest(".rg"); if(!hit) return;
    const el=sheetEl.querySelector('.rgitem[data-rg="'+hit.dataset.rg+'"]');
    if(el&&SEL!==hit.dataset.rg) el.classList.remove("on");
  });
}

/* ══ 연결 고르기 ══════════════════════════════════════ */
function openLinkPicker(){
  const others=ST.items.filter(x=>x.id!==CUR.id).sort((a,b)=>b.createdAt-a.createdAt);
  const chosen=new Set(CUR.links||[]);
  const scrim=document.createElement("div");
  scrim.className="scrim";
  scrim.innerHTML='<div class="modal"><header><h3>어울리는 것 고르기</h3><span class="lbl" id="lpN"></span></header>'+
    '<div class="body">'+(others.length?'<div class="pickgrid">'+others.map(o=>
      '<button class="pick" data-id="'+o.id+'" aria-pressed="'+(chosen.has(o.id)?"true":"false")+'"><img src="'+urlFor(o.img&&o.img.key)+'" alt=""><div class="cap">'+esc(o.title||"제목 없음")+'</div></button>').join("")+'</div>'
      :'<p style="color:var(--muted);margin:0">아직 다른 사진이 없어요.</p>')+'</div>'+
    '<footer><button class="btn" data-cancel>취소</button><button class="btn primary" data-ok>연결하기</button></footer></div>';
  document.body.appendChild(scrim);
  const nEl=scrim.querySelector("#lpN");
  const upd=()=>{nEl.textContent=chosen.size?chosen.size+"개 선택":"";};
  upd();
  scrim.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.id;
    if(chosen.has(id)) chosen.delete(id); else chosen.add(id);
    b.setAttribute("aria-pressed",chosen.has(id)?"true":"false"); upd();
  }));
  const close=()=>scrim.remove();
  scrim.addEventListener("click",e=>{ if(e.target===scrim) close(); });
  scrim.querySelector("[data-cancel]").addEventListener("click",close);
  scrim.querySelector("[data-ok]").addEventListener("click",()=>{
    const before=new Set(CUR.links||[]);
    CUR.links=Array.from(chosen);
    ST.items.forEach(o=>{
      if(o.id===CUR.id) return;
      o.links=o.links||[];
      const should=chosen.has(o.id);
      const has=o.links.indexOf(CUR.id)>=0;
      if(should&&!has) o.links.push(CUR.id);
      if(!should&&has&&before.has(o.id)) o.links=o.links.filter(x=>x!==CUR.id);
    });
    save(); renderLinks(); graphDirty(); close();
  });
}

/* ══ 그래프 ═══════════════════════════════════════════ */
const G={nodes:[],edges:[],byId:new Map()};
let view={x:0,y:0,k:1}, alpha=0, raf=null, hoverN=null, dragN=null, panning=null, needBuild=true, graphOn=false;
let OPT={mode:"photo",tags:true,auto:true,affin:true,thr:2,labels:true};
let cv=null,ctx=null,DPR=1;

function graphDirty(){ needBuild=true; if(graphOn) buildGraph(); }

function imgEl(key){
  if(!key) return null;
  if(IMGS.has(key)) return IMGS.get(key);
  const u=urlFor(key); if(!u) return null;
  const im=new Image(); im.src=u; IMGS.set(key,im); return im;
}
function sharedTags(a,b){
  const A=itemTagIds(a), B=new Set(itemTagIds(b));
  let n=0; A.forEach(id=>{ if(B.has(id)) n++; });
  return n;
}
function buildGraph(){
  const prev=new Map(G.nodes.map(n=>[n.id,n]));
  const nodes=[], edges=[];
  const items=ST.items;
  const REG = OPT.mode==="region";
  const at=(id,d)=>{ const p=prev.get(id); return {x:p?p.x:(Math.random()-.5)*d, y:p?p.y:(Math.random()-.5)*d}; };

  /* 사진 노드 — 부분 모드에서도 남는다. 부분이 여기서 갈라져 나온다. */
  items.forEach(it=>{
    const rc=(it.regions||[]).length;
    const pos=at(it.id,420);
    nodes.push({id:it.id,type:"item",ref:it,
      r: REG ? 13+Math.min(7,rc*1.4) : 17+Math.min(11,rc*2.2),
      x:pos.x,y:pos.y,vx:0,vy:0,label:it.title||"제목 없음"});
  });

  /* 좋아하는 부분 노드 */
  if(REG){
    items.forEach(it=>{
      (it.regions||[]).forEach((r,i)=>{
        const id="r:"+it.id+":"+r.id;
        const pos=at(id,420);
        nodes.push({id:id,type:"region",ref:{it:it,r:r,i:i},r:15,
          x:pos.x,y:pos.y,vx:0,vy:0,
          label:(r.text||"").slice(0,24)||(it.title||"제목 없음")});
        /* 사진 → 부분 : 짧게 붙여 한 덩어리로 보이게 */
        edges.push({a:it.id,b:id,kind:"branch",w:1.2,len:44});
      });
    });
  }

  /* 태그 노드 — 사진에도 부분에도 붙는다 */
  const tagUse=new Map();   /* tagId -> [단위 id...] 친화선 계산용 */
  const noteUse=(tid,unit)=>{
    if(!tagUse.has(tid)) tagUse.set(tid,[]);
    tagUse.get(tid).push(unit);
  };
  if(OPT.tags){
    ST.tags.forEach(t=>{
      const n=tagCount(t.id); if(!n) return;
      const pos=at("t:"+t.id,420);
      nodes.push({id:"t:"+t.id,type:"tag",ref:t,r:5+Math.min(9,n*1.5),
        x:pos.x,y:pos.y,vx:0,vy:0,label:t.name,color:catColor(t.cat)});
    });
    const known=new Set(ST.tags.map(t=>t.id));
    items.forEach(it=>{
      if(REG){
        /* 사진에 직접 붙인 태그만 사진에, 부분 태그는 그 부분에 */
        (it.tags||[]).forEach(tid=>{ if(!known.has(tid)) return;
          edges.push({a:it.id,b:"t:"+tid,kind:"tag",w:1,len:74}); noteUse(tid,it.id); });
        (it.regions||[]).forEach(r=>{
          const rid="r:"+it.id+":"+r.id;
          (r.tags||[]).forEach(tid=>{ if(!known.has(tid)) return;
            edges.push({a:rid,b:"t:"+tid,kind:"tag",w:1,len:66}); noteUse(tid,rid); });
        });
      }else{
        itemTagIds(it).forEach(tid=>{ if(!known.has(tid)) return;
          edges.push({a:it.id,b:"t:"+tid,kind:"tag",w:1,len:78}); noteUse(tid,it.id); });
      }
    });

    /* ── 태그끼리 잇기 — "무엇이 무엇과 어울리나"
       같은 사진(또는 같은 부분)에서 함께 쓰인 횟수만큼 굵어진다. */
    if(OPT.affin){
      const ids=[...tagUse.keys()];
      for(let i=0;i<ids.length;i++){
        const A=new Set(tagUse.get(ids[i]));
        for(let j=i+1;j<ids.length;j++){
          let n=0;
          for(const u of tagUse.get(ids[j])) if(A.has(u)) n++;
          if(n>=2) edges.push({a:"t:"+ids[i],b:"t:"+ids[j],kind:"affin",
            w:Math.min(3.4,0.8+n*0.55),len:Math.max(58,110-n*9),n:n});
        }
      }
    }
  }

  /* 손으로 이어둔 것 + 닮은 것끼리 */
  const units = REG
    ? nodes.filter(n=>n.type==="region").map(n=>({id:n.id,tags:new Set((n.ref.r.tags||[]).concat(n.ref.it.tags||[]))}))
    : items.map(it=>({id:it.id,tags:new Set(itemTagIds(it))}));

  items.forEach(a=>{
    (a.links||[]).forEach(bid=>{
      if(a.id<bid && items.some(x=>x.id===bid)) edges.push({a:a.id,b:bid,kind:"link",w:2.4,len:120});
    });
  });
  if(OPT.auto){
    for(let i=0;i<units.length;i++) for(let j=i+1;j<units.length;j++){
      const A=units[i], B=units[j];
      let n=0; for(const t of A.tags) if(B.tags.has(t)) n++;
      if(n>=OPT.thr) edges.push({a:A.id,b:B.id,kind:"auto",w:Math.min(2,.5+n*.35),len:150,s:n});
    }
  }

  G.nodes=nodes; G.edges=edges;
  G.byId=new Map(nodes.map(n=>[n.id,n]));
  G.edges=G.edges.filter(e=>G.byId.has(e.a)&&G.byId.has(e.b));
  G.adj=new Map(nodes.map(n=>[n.id,new Set()]));
  G.edges.forEach(e=>{G.adj.get(e.a).add(e.b);G.adj.get(e.b).add(e.a);});
  needBuild=false;
  alpha=1;
  const warm=Math.min(260,Math.max(90,Math.round(9000/Math.max(6,nodes.length))));
  for(let i=0;i<warm;i++) tick();
  alpha=0.4;
  fitGraph();
  $("#gempty").hidden = nodes.length>0;
  kick();
}
function fitGraph(){
  if(!cv||!G.nodes.length) return;
  const W=cv.width/DPR, H=cv.height/DPR;
  if(W<20||H<20) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  G.nodes.forEach(n=>{
    x0=Math.min(x0,n.x-n.r-24); x1=Math.max(x1,n.x+n.r+24);
    y0=Math.min(y0,n.y-n.r-18); y1=Math.max(y1,n.y+n.r+34);
  });
  const w=Math.max(60,x1-x0), h=Math.max(60,y1-y0);
  const k=clamp(Math.min((W-140)/w,(H-110)/h),0.25,1.4);
  view.k=k;
  view.x=-((x0+x1)/2)*k;
  view.y=-((y0+y1)/2)*k;
}
function tick(){
  if(alpha<=0.004) return;
  const N=G.nodes, n=N.length;
  for(let i=0;i<n;i++){
    const a=N[i];
    for(let j=i+1;j<n;j++){
      const b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d2=dx*dx+dy*dy;
      if(d2<0.01){ dx=(Math.random()-.5); dy=(Math.random()-.5); d2=0.01; }
      const d=Math.sqrt(d2);
      let f=3600/d2;
      const minD=a.r+b.r+14;
      if(d<minD) f+=(minD-d)*0.55;
      const fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
  }
  G.edges.forEach(e=>{
    const a=G.byId.get(e.a), b=G.byId.get(e.b);
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||0.01;
    const f=(d-e.len)*0.028*e.w;
    const fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  N.forEach(nd=>{
    nd.vx-=nd.x*0.011; nd.vy-=nd.y*0.011;
    if(nd===dragN){ nd.vx=nd.vy=0; return; }
    nd.vx*=0.80; nd.vy*=0.80;
    nd.x+=nd.vx*alpha; nd.y+=nd.vy*alpha;
  });
  alpha*=0.988;
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function draw(){
  if(!ctx) return;
  const W=cv.width/DPR, H=cv.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=cssVar("--graph-bg")||"#f0f0ec";
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+view.x,H/2+view.y); ctx.scale(view.k,view.k);

  const focus=hoverN||dragN;
  const near=focus?G.adj.get(focus.id):null;
  const edgeC=cssVar("--graph-edge")||"rgba(0,0,0,.16)";
  const edgeS=cssVar("--graph-edge-soft")||"rgba(0,0,0,.07)";
  const accent=cssVar("--accent")||"#14425C";

  G.edges.forEach(e=>{
    const a=G.byId.get(e.a), b=G.byId.get(e.b);
    const hot=focus&&(e.a===focus.id||e.b===focus.id);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle = hot ? accent
      : (e.kind==="auto" ? edgeS
      : (e.kind==="affin" ? accent : edgeC));
    ctx.lineWidth=(hot?1.7:(e.kind==="link"?1.5:(e.kind==="affin"?e.w:(e.kind==="branch"?1.1:0.9))))
      /Math.max(.6,view.k*0.75);
    if(e.kind==="auto") ctx.setLineDash([3/view.k,3/view.k]);
    else ctx.setLineDash([]);
    ctx.globalAlpha = focus&&!hot ? 0.22 : (e.kind==="affin" ? 0.34 : 1);
    ctx.stroke();
  });
  ctx.setLineDash([]); ctx.globalAlpha=1;

  const line=cssVar("--line-2")||"#d3d3cd";
  const ink=cssVar("--ink")||"#15181c";
  const muted=cssVar("--muted")||"#8a9099";

  G.nodes.forEach(nd=>{
    const dim=focus&&nd!==focus&&!(near&&near.has(nd.id));
    ctx.globalAlpha=dim?0.2:1;
    if(nd.type==="region"){
      const rg=nd.ref.r, it=nd.ref.it;
      const s=nd.r*2, x=nd.x-nd.r, y=nd.y-nd.r;
      const shape=()=>{
        if(rg.path&&rg.path.length>2){
          ctx.beginPath();
          rg.path.forEach((pt,k)=>{
            const px=x+(pt[0]/100)*s, py=y+(pt[1]/100)*s;
            if(k) ctx.lineTo(px,py); else ctx.moveTo(px,py);
          });
          ctx.closePath();
        }else roundRect(ctx,x,y,s,s,3);
      };
      ctx.save(); shape(); ctx.clip();
      const im=imgEl(it.img&&it.img.key);
      if(im&&im.complete&&im.naturalWidth){
        const iw=im.naturalWidth, ih=im.naturalHeight;
        const sw=Math.max(1,rg.w*iw), sh=Math.max(1,rg.h*ih);
        const sc=Math.max(s/sw,s/sh);
        ctx.drawImage(im, rg.x*iw, rg.y*ih, sw, sh,
          nd.x-sw*sc/2, nd.y-sh*sc/2, sw*sc, sh*sc);
      }else{ ctx.fillStyle=line; ctx.fillRect(x,y,s,s); }
      ctx.restore();
      shape();
      ctx.strokeStyle=(nd===focus)?accent:accent;
      ctx.globalAlpha=(dim?0.2:1)*(nd===focus?1:0.55);
      ctx.lineWidth=(nd===focus?2:1.2)/view.k; ctx.stroke();
      ctx.globalAlpha=dim?0.2:1;
    }else if(nd.type==="item"){
      const s=nd.r*2, x=nd.x-nd.r, y=nd.y-nd.r;
      ctx.save();
      roundRect(ctx,x,y,s,s,3); ctx.clip();
      const im=imgEl(nd.ref.img&&nd.ref.img.key);
      if(im&&im.complete&&im.naturalWidth){
        const iw=im.naturalWidth, ih=im.naturalHeight;
        const sc=Math.max(s/iw,s/ih);
        ctx.drawImage(im,nd.x-iw*sc/2,nd.y-ih*sc/2,iw*sc,ih*sc);
      }else{ ctx.fillStyle=line; ctx.fillRect(x,y,s,s); }
      ctx.restore();
      roundRect(ctx,x,y,s,s,3);
      ctx.strokeStyle=(nd===focus)?accent:line;
      ctx.lineWidth=(nd===focus?2:1)/view.k; ctx.stroke();
    }else{
      ctx.beginPath(); ctx.arc(nd.x,nd.y,nd.r,0,Math.PI*2);
      ctx.fillStyle=nd.color; ctx.fill();
      if(nd===focus){ ctx.lineWidth=2/view.k; ctx.strokeStyle=accent; ctx.stroke(); }
    }
  });
  if(OPT.labels){
    ctx.textAlign="center"; ctx.textBaseline="top";
    G.nodes.forEach(nd=>{
      const on=nd===focus||(near&&near.has(nd.id));
      if(view.k<=0.5&&!on) return;
      const dim=focus&&!on;
      const max=nd.type==="tag"?12:10;
      const t=nd.label.length>max?nd.label.slice(0,max-1)+"…":nd.label;
      const fs=11/view.k;
      ctx.font=(nd.type==="tag"?"500 ":"400 ")+fs+'px "IBM Plex Sans KR","IBM Plex Sans",sans-serif';
      ctx.globalAlpha=dim?0.18:1;
      ctx.lineWidth=3.4/view.k;
      ctx.strokeStyle=cssVar("--graph-bg")||"#f0f0ec";
      ctx.lineJoin="round";
      ctx.strokeText(t,nd.x,nd.y+nd.r+5/view.k);
      ctx.fillStyle=nd.type==="tag"?ink:muted;
      ctx.fillText(t,nd.x,nd.y+nd.r+5/view.k);
    });
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(){
  raf=null;
  if(!graphOn) return;
  tick(); draw();
  if(alpha>0.004||hoverN||dragN||panning) kick();
}
function kick(){ if(!raf&&graphOn) raf=requestAnimationFrame(loop); }
function resizeCanvas(){
  if(!cv) return;
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*DPR));
  cv.height=Math.max(1,Math.round(r.height*DPR));
  draw();
}
function toWorld(px,py){
  const W=cv.width/DPR,H=cv.height/DPR;
  return {x:(px-W/2-view.x)/view.k,y:(py-H/2-view.y)/view.k};
}
function nodeAt(px,py){
  const p=toWorld(px,py);
  for(let i=G.nodes.length-1;i>=0;i--){
    const n=G.nodes[i];
    const dx=p.x-n.x, dy=p.y-n.y;
    if(n.type==="item"){ if(Math.abs(dx)<=n.r&&Math.abs(dy)<=n.r) return n; }
    else if(dx*dx+dy*dy<=(n.r+4)*(n.r+4)) return n;
  }
  return null;
}
/* 짧게 누르면 열고, 끌거나 길게 누르면 옮기기만 한다.
   노드를 옮기려고 끌었을 뿐인데 사진이 열려버리는 걸 막는다. */
const TAP_SLOP=6;   // 이만큼(px) 넘게 움직이면 "옮기려던 것"
const TAP_MS=500;   // 이보다 오래 누르고 있었으면 "옮기려던 것"
let press=null;

function wireGraph(){
  cv=$("#cv"); ctx=cv.getContext("2d");
  const tip=$("#gtip");
  const rect=()=>cv.getBoundingClientRect();
  cv.addEventListener("pointerdown",e=>{
    const r=rect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const n=nodeAt(px,py);
    /* press 를 먼저 세운다. 캡처가 실패해도 탭/드래그 구분은 살아 있어야 한다. */
    press={x:e.clientX,y:e.clientY,t:Date.now(),moved:false,used:false};
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    if(n){ dragN=n; n.grabbed={dx:0,dy:0}; alpha=Math.max(alpha,.35); }
    else { panning={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; cv.classList.add("drag"); }
    kick();
  });
  cv.addEventListener("pointermove",e=>{
    const r=rect(), px=e.clientX-r.left, py=e.clientY-r.top;
    if(press&&!press.moved){
      const dx=e.clientX-press.x, dy=e.clientY-press.y;
      if(dx*dx+dy*dy > TAP_SLOP*TAP_SLOP) press.moved=true;
    }
    if(dragN){
      const p=toWorld(px,py);
      dragN.x=p.x; dragN.y=p.y; dragN.vx=dragN.vy=0;
      cv.style.cursor="grabbing";   /* 옮기는 중이라는 신호 */
      alpha=Math.max(alpha,.3); kick(); return;
    }
    if(panning){
      view.x=panning.vx+(e.clientX-panning.x);
      view.y=panning.vy+(e.clientY-panning.y);
      kick(); return;
    }
    const n=nodeAt(px,py);
    if(n!==hoverN){ hoverN=n; kick(); }
    cv.style.cursor=n?"pointer":"grab";
    if(n){
      let sub="";
      if(n.type==="item"){
        const rc=(n.ref.regions||[]).length, tc=itemTagIds(n.ref).length;
        sub=(rc?rc+"개의 메모 · ":"")+(tc?tc+"개의 태그":"태그 없음");
      }else if(n.type==="region"){
        const tc=(n.ref.r.tags||[]).length;
        sub=esc(n.ref.it.title||"제목 없음")+" · "+(tc?tc+"개의 태그":"태그 없음");
      }else sub=CATMAP[n.ref.cat].name+" · "+tagCount(n.ref.id)+"장";
      tip.innerHTML='<div class="lbl">'+esc(sub)+'</div>'+esc(n.label);
      tip.hidden=false;
      tip.style.left=Math.min(px+14,r.width-240)+"px";
      tip.style.top=Math.max(8,py-10)+"px";
    }else tip.hidden=true;
  });
  const end=e=>{
    try{cv.releasePointerCapture(e.pointerId);}catch(_){}
    if(dragN){ dragN=null; alpha=Math.max(alpha,.25); cv.style.cursor="pointer"; }
    panning=null; cv.classList.remove("drag"); kick();
  };
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",()=>{hoverN=null;$("#gtip").hidden=true;kick();});
  cv.addEventListener("click",e=>{
    /* 끌어서 옮겼거나 오래 누르고 있었으면 열지 않는다 —
       위치만 바꾸려던 것이지 들어가려던 게 아니다. */
    const p=press;
    if(!p||p.used) return;
    p.used=true;
    if(p.moved) return;
    if(Date.now()-p.t > TAP_MS) return;

    const r=rect(); const n=nodeAt(e.clientX-r.left,e.clientY-r.top);
    if(!n) return;
    if(n.type==="item") openItem(n.ref.id);
    else if(n.type==="region") openItem(n.ref.it.id,n.ref.r.id);
    else{ FILTER.tags=new Set([n.ref.id]); setView("archive"); renderAll(); }
  });
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=rect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const W=cv.width/DPR,H=cv.height/DPR;
    const before=toWorld(px,py);
    const k=clamp(view.k*Math.pow(1.0016,-e.deltaY),0.22,4);
    view.k=k;
    view.x=px-W/2-before.x*k; view.y=py-H/2-before.y*k;
    kick();
  },{passive:false});
  new ResizeObserver(resizeCanvas).observe(cv.parentElement);

  const bind=(id,key,fn)=>$(id).addEventListener("change",e=>{OPT[key]=fn?fn(e.target):e.target.checked;graphDirty();});
  bind("#gTags","tags"); bind("#gAuto","auto"); bind("#gLabels","labels");
  bind("#gAffin","affin");
  $$("#gMode button").forEach(b=>b.addEventListener("click",()=>{
    OPT.mode=b.dataset.gmode;
    $$("#gMode button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
    graphDirty();
  }));
  $("#gThr").addEventListener("input",e=>{
    OPT.thr=+e.target.value;
    $("#gThrV").textContent=OPT.thr+"개 이상";
    graphDirty();
  });
  $("#legend").innerHTML=CATS.filter(c=>c.id!=="etc").map(c=>
    '<span><i class="dot" style="background:var('+c.v+')"></i>'+esc(c.name)+'</span>').join("");
}

/* ══ 백업 ═════════════════════════════════════════════ */
function blobToDataURL(b){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(r.error);
    r.readAsDataURL(b);
  });
}
async function saveFile(name,text){
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const d=await window.claude.use("downloads");
      if(d){ await d.save({filename:name,data:text}); return true; }
    }
  }catch(err){
    if(err&&err.code==="declined") return false;
    console.warn(err);
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){ return false; }
}
const CHUNK=10*1024*1024;
async function itemBlob(it){
  if(Vault.ok){
    const u=URLS.get(it.id);
    if(u){ try{ return await (await fetch(u)).blob(); }catch(e){} }
    try{
      const imgs=await subDir("images");
      const h=await imgs.getFileHandle(it.img.file);
      return await h.getFile();
    }catch(e){ return null; }
  }
  try{ return await imgGet(it.img&&it.img.key); }catch(e){ return null; }
}
async function buildPacks(){
  const packs=[[]]; let size=0;
  for(const it of ST.items){
    let dataURL="";
    try{
      const blob=await itemBlob(it);
      if(blob) dataURL=await blobToDataURL(blob);
    }catch(e){ console.warn(e); }
    const rec=JSON.parse(JSON.stringify(it)); rec.image=dataURL;
    if(size+dataURL.length>CHUNK&&packs[packs.length-1].length){ packs.push([]); size=0; }
    packs[packs.length-1].push(rec); size+=dataURL.length+400;
  }
  return packs;
}
async function exportAll(){
  if(!ST.items.length){ toast("아직 담은 사진이 없어요.",true); return; }
  toast("백업을 준비하고 있어요…");
  const packs=await buildPacks();
  const stamp=new Date().toISOString().slice(0,10).replace(/-/g,"");
  let ok=0;
  for(let i=0;i<packs.length;i++){
    const payload={app:"gusuk",v:1,exportedAt:Date.now(),part:i+1,parts:packs.length,
      tags:ST.tags,spaces:ST.spaces||[],boards:ST.boards||[],items:packs[i]};
    const name="\uc88b\uc544\ud558\ub294\uad6c\uc11d-"+stamp+(packs.length>1?"-"+(i+1)+"of"+packs.length:"")+".json";
    if(await saveFile(name,JSON.stringify(payload))) ok++;
    else break;
  }
  if(ok) toast(packs.length>1? "\ubc31\uc5c5 "+ok+"\uac1c \ud30c\uc77c\ub85c \uc800\uc7a5\ud588\uc5b4\uc694":"\ubc31\uc5c5\uc744 \uc800\uc7a5\ud588\uc5b4\uc694");
}
async function importFiles(files){
  const list=Array.prototype.slice.call(files);
  let items=0;
  for(const f of list){
    let data;
    try{ data=JSON.parse(await f.text()); }
    catch(e){ toast(f.name+" 을(를) 읽지 못했어요.",true); continue; }
    if(!data||data.app!=="gusuk"||!Array.isArray(data.items)){ toast(f.name+" 은(는) 이 아카이브의 백업이 아니에요.",true); continue; }
    const remap=new Map();
    (data.tags||[]).forEach(t=>{ const nt=ensureTag(t.name,t.cat); if(nt) remap.set(t.id,nt.id); });
    /* 보드는 이름으로 맞추고 핀은 합집합으로 — 같은 프로젝트면 이어붙는다 */
    (data.boards||[]).forEach(rb=>{
      if(!rb||!rb.name) return;
      const nb=ensureBoard(rb.name);
      if(!nb) return;
      if(rb.note&&!nb.note) nb.note=rb.note;
      (rb.pins||[]).forEach(p=>{
        if(!p||!p.item) return;
        if(!boardHas(nb,p.item,p.region)) nb.pins.push({item:p.item,region:p.region||null});
      });
    });
    /* 공간도 id 가 아니라 이름으로 맞춘다 — 다른 기기에서 온 백업이어도 같은 이름이면 합쳐진다 */
    const spmap=new Map();
    (data.spaces||[]).forEach(sp=>{
      const ns=ensureSpace(sp.name); if(!ns) return;
      spmap.set(sp.id,ns.id);
      if(sp.note&&!ns.note) ns.note=sp.note;
      if(Array.isArray(sp.facts)&&!(ns.facts||[]).length)
        ns.facts=sp.facts.filter(f=>f&&f.k).map(f=>({k:String(f.k),v:String(f.v||"")}));
    });
    const fix=ids=>(ids||[]).map(id=>remap.get(id)||id).filter(id=>ST.tags.some(t=>t.id===id));
    for(const rec of data.items){
      if(ST.items.some(x=>x.id===rec.id)) continue;
      let blob=null;
      if(rec.image){ try{ blob=await (await fetch(rec.image)).blob(); }catch(e){ console.warn(e); } }
      const it={
        id:rec.id,title:rec.title||"",note:rec.note||"",
        space:rec.space?(spmap.get(rec.space)||null):null,
        tags:fix(rec.tags),
        regions:(rec.regions||[]).map(r=>({id:r.id,x:r.x,y:r.y,w:r.w,h:r.h,text:r.text||"",
          path:Array.isArray(r.path)?r.path:null,tags:fix(r.tags)})),
        links:rec.links||[],
        img:null,
        createdAt:rec.createdAt||Date.now(), updatedAt:Date.now()
      };
      if(Vault.ok){
        it.img={key:it.id,file:null,w:(rec.img&&rec.img.w)||3,h:(rec.img&&rec.img.h)||2};
        if(blob){
          const ext=(blob.type||"").indexOf("webp")>=0?"webp":"jpg";
          await vaultWriteImage(it,blob,ext);
          URLS.set(it.id,URL.createObjectURL(blob));
        }
        ST.items.push(it);
        await vaultWriteNote(it);
      }else{
        if(blob){
          const key=uid("i"); await imgPut(key,blob); URLS.set(key,URL.createObjectURL(blob));
          it.img={key:key,w:(rec.img&&rec.img.w)||3,h:(rec.img&&rec.img.h)||2};
        }
        ST.items.push(it);
      }
      items++;
    }
  }
  const ids=new Set(ST.items.map(x=>x.id));
  ST.items.forEach(it=>{ it.links=(it.links||[]).filter(l=>ids.has(l)&&l!==it.id); });
  pruneTags(); pruneSpaces(); pruneBoards();
  if(Vault.ok){ await vaultWriteTags(); await vaultWriteSpaces(); await vaultWriteBoards(); } else save();
  renderAll();
  toast(items? items+"장을 불러왔어요" : "새로 불러올 사진이 없었어요");
}

    if(e.target.closest("[data-add]")){ $("#filePick").click(); return; }
    if(e.target.closest(".spacehead")) return;   /* 머리말 입력칸은 그냥 둔다 */
    const pb=e.target.closest("[data-pinadd]");
    if(pb){ e.stopPropagation(); handlePinClick(pb); return; }
    const sp=e.target.closest("[data-space]");
    if(sp){ INSPACE=sp.dataset.space; renderArchive(); $("#main").scrollTop=0; return; }
    const c=e.target.closest("[data-open]"); if(c) openItem(c.dataset.open,c.dataset.rgsel);
  });
  /* 우클릭 → 메뉴 */
  $("#gridWrap").addEventListener("contextmenu",e=>{
    const card=e.target.closest(".card[data-open]");
    if(!card) return;
    e.preventDefault();
    const t=cardTarget(card);
    if(t) openCardMenu(e.clientX,e.clientY,t.item,t.region);
  });

  /* 폰: 길게 누르기 → 같은 메뉴 */
  let holdTimer=null, holdFrom=null;
  const cancelHold=()=>{ clearTimeout(holdTimer); holdTimer=null; holdFrom=null; };
  $("#gridWrap").addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse") return;          /* 마우스는 우클릭으로 */
    const card=e.target.closest(".card[data-open]");
    if(!card||e.target.closest("[data-pinadd]")) return;
    holdFrom={x:e.clientX,y:e.clientY};
    holdTimer=setTimeout(()=>{
      const t=cardTarget(card);
      if(t){
        ctxSuppressClick=true;                   /* 손을 뗄 때 카드가 열리지 않게 */
        if(navigator.vibrate) try{navigator.vibrate(12);}catch(_){}
        openCardMenu(holdFrom.x,holdFrom.y,t.item,t.region);
      }
      cancelHold();
    },480);
  });
  $("#gridWrap").addEventListener("pointermove",e=>{
    if(!holdFrom) return;
    if(Math.abs(e.clientX-holdFrom.x)>10||Math.abs(e.clientY-holdFrom.y)>10) cancelHold();
  });
  $("#gridWrap").addEventListener("pointerup",cancelHold);
  $("#gridWrap").addEventListener("pointercancel",cancelHold);

  /* 마우스를 올려둔 카드 기억 — P 키로 바로 담기 */
  $("#gridWrap").addEventListener("mouseover",e=>{
    const c=e.target.closest(".card[data-open]");
    if(c) hoverCard=c;
  });
  $("#gridWrap").addEventListener("mouseout",e=>{
    if(hoverCard&&!hoverCard.contains(e.relatedTarget)) hoverCard=null;
  });

  $("#gridWrap").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const sp=e.target.closest("[data-space]");
    if(sp){ e.preventDefault(); INSPACE=sp.dataset.space; renderArchive(); return; }
    const c=e.target.closest("[data-open]");
    if(c){ e.preventDefault(); openItem(c.dataset.open,c.dataset.rgsel); }
  });

  let dragDepth=0, dropEl=null;
  window.addEventListener("dragover",e=>{ e.preventDefault(); });
  window.addEventListener("dragenter",e=>{
    e.preventDefault();
    if(!e.dataTransfer||Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")<0) return;
    dragDepth++;
    if(!dropEl){ dropEl=document.createElement("div"); dropEl.className="drop-on";
      dropEl.innerHTML="<span>여기에 놓으면 담깁니다</span>"; document.body.appendChild(dropEl); }
  });
  window.addEventListener("dragleave",()=>{ dragDepth--; if(dragDepth<=0&&dropEl){dropEl.remove();dropEl=null;dragDepth=0;} });
  window.addEventListener("drop",e=>{
    e.preventDefault(); dragDepth=0;
    if(dropEl){ dropEl.remove(); dropEl=null; }
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  window.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    const typing=tag==="input"||tag==="textarea";
    if(e.key==="Escape"){
      if(ctxEl){ closeCtx(); return; }
      const scrim=document.querySelector(".scrim");
      if(scrim){ scrim.remove(); return; }
      if(Rail.isOpen){ Rail.close(); return; }
      if(sheetEl&&!sheetEl.hidden){ if(typing) e.target.blur(); else closeSheet(); }
      return;
    }
    if(typing) return;
    if(sheetEl&&!sheetEl.hidden){
      if(e.key==="ArrowLeft") stepItem(-1);
      else if(e.key==="ArrowRight") stepItem(1);
      else if(e.key==="d"||e.key==="D"){ DRAW=!DRAW; updateDrawUI(); }
    }else{
      if((e.key==="p"||e.key==="P")&&hoverCard){
        e.preventDefault();
        const t=cardTarget(hoverCard);
        if(t) pinTo(ensureCurrentBoard(),t.item,t.region);
      }
      else if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }
      else if(e.key==="g"||e.key==="G") setView(VIEW==="graph"?"archive":"graph");
    }
  });
  window.addEventListener("resize",()=>{ fitFrame(); });
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change",()=>draw());
  new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  wireGraph();
  wireVault();
}

/* ══ 밖에서 들어온 사진 받기 ══════════════════════════════
   · 공유 타겟: 사진 앱에서 "공유 → 좋아하는 구석" (안드로이드)
   · 홈 화면 아이콘 길게 누르기 → "사진 찍어서 담기"
   둘 다 주소의 물음표 뒤 값으로 구분한다. */
async function intakeFromOutside(){
  let params;
  try{ params=new URLSearchParams(location.search); }catch(e){ return; }
  if(!params.toString()) return;

  // 주소창을 곧바로 깨끗하게 되돌린다 (새로고침해도 같은 동작이 반복되지 않게)
  try{ history.replaceState(null,"",location.pathname); }catch(e){}

  if(params.get("action")==="camera"){
    setTimeout(()=>$("#camPick").click(),300);
    return;
  }
  if(params.get("share-target")!=="1") return;

  try{
    const cache=await caches.open("gusuk-share-inbox");
    const keys=await cache.keys();
    if(!keys.length) return;
    const files=[];
    for(const k of keys){
      const res=await cache.match(k);
      if(!res) continue;
      const blob=await res.blob();
      const name=decodeURIComponent(res.headers.get("x-name")||"shared.jpg");
      files.push(new File([blob],name,{type:blob.type||"image/jpeg"}));
      await cache.delete(k);
    }
    if(files.length) await addFiles(files);
  }catch(e){ console.warn("공유받은 사진을 가져오지 못했어요",e); }
}

/* ══ 시작 ═════════════════════════════════════════════ */
(async function init(){
  wire();
  if(FOLDER_UI && FS_OK){
    try{ await restoreFolder(); }catch(e){ console.warn(e); }
  }
  if(Vault.ok || Vault.dir){ renderAll(); renderVaultUI(); intakeFromOutside(); return; }
  try{
    const saved=await kvGet("state");
    if(saved&&Array.isArray(saved.items)){
      ST=Object.assign({v:1,seq:1,items:[],tags:[],spaces:[],boards:[]},saved);
      ST.spaces=ST.spaces||[]; ST.boards=ST.boards||[];
      ST.items.forEach(it=>{ it.tags=it.tags||[]; it.regions=it.regions||[]; it.links=it.links||[];
        if(it.space===undefined) it.space=null; });
      await hydrateURLs();
    }
  }catch(e){
    console.warn(e);
    toast("저장된 기록을 여는 데 실패했어요. 사생활 보호 모드인지 확인해 주세요.",true);
  }
  renderAll(); renderVaultUI();
  intakeFromOutside();
})();
})();
</script>
<script>
/* ── 서비스 워커: 오프라인 실행 + 설치 ────────────────────
   updateViaCache:"none" — sw.js 자체를 HTTP 캐시에서 꺼내 쓰지 않게 한다.
   이게 없으면 리뉴얼 후에도 브라우저가 낡은 sw.js 를 몇 시간 붙들 수 있다. */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker
      .register("sw.js", { updateViaCache: "none" })
      .then(function (reg) {
        // 앱을 열 때마다 새 버전이 있는지 확인
        reg.update().catch(function () {});
        reg.addEventListener("updatefound", function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", function () {
            if (sw.state === "installed" && navigator.serviceWorker.controller) {
              console.log("새 버전을 받았어요. 앱을 다시 열면 적용됩니다.");
            }
          });
        });
      })
      .catch(function (e) { console.warn("sw 등록 실패", e); });
  });
}
</script>
