<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>좋아하는 구석</title>
<meta name="description" content="마음에 든 구석을 사진으로 모으고, 그 이유를 태그로 남기는 개인 아카이브">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="좋아하는 구석">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --paper:#F4F4F1;
  --card:#FFFFFF;
  --sunk:#EBEBE7;
  --ink:#15181C;
  --ink-2:#474D55;
  --muted:#8A9099;
  --faint:#B2B7BD;
  --line:#E3E3DE;
  --line-2:#D3D3CD;
  --accent:#14425C;
  --accent-hi:#1D6089;
  --accent-on:#FFFFFF;
  --accent-soft:rgba(20,66,92,.08);
  --accent-mid:rgba(20,66,92,.22);
  --accent-line:rgba(20,66,92,.55);
  --shadow:0 1px 2px rgba(21,24,28,.05), 0 8px 24px -14px rgba(21,24,28,.28);
  --shadow-lift:0 2px 4px rgba(21,24,28,.06), 0 18px 40px -20px rgba(21,24,28,.38);
  --danger:#9E3B2B;
  /* 카테고리 안료 */
  --c-color:#A8613C;
  --c-material:#6C7A52;
  --c-light:#A5872C;
  --c-object:#5B6B8C;
  --c-structure:#41675E;
  --c-mood:#7A5A82;
  --c-detail:#8C5B5B;
  --c-etc:#7C8188;
  --graph-bg:#F0F0EC;
  --graph-edge:rgba(21,24,28,.16);
  --graph-edge-soft:rgba(21,24,28,.07);

  --f-display:"Instrument Serif","Gowun Batang",Georgia,serif;
  --f-body:"IBM Plex Sans KR","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --bar:52px;
  --rail:252px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101215;
    --card:#171A1E;
    --sunk:#1D2126;
    --ink:#E9E9E5;
    --ink-2:#B6BBC1;
    --muted:#848A92;
    --faint:#5D646C;
    --line:#262A30;
    --line-2:#343941;
    --accent:#8FBBD6;
    --accent-hi:#B4D6EA;
    --accent-on:#0C1418;
    --accent-soft:rgba(143,187,214,.11);
    --accent-mid:rgba(143,187,214,.26);
    --accent-line:rgba(143,187,214,.7);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 50px -22px rgba(0,0,0,.9);
    --danger:#D97A66;
    --c-color:#D79A6E;
    --c-material:#A3B283;
    --c-light:#DCC067;
    --c-object:#93A4C6;
    --c-structure:#77A296;
    --c-mood:#B392BB;
    --c-detail:#C48F8F;
    --c-etc:#9BA1A9;
    --graph-bg:#0C0E11;
    --graph-edge:rgba(233,233,229,.18);
    --graph-edge-soft:rgba(233,233,229,.07);
  }
}
:root[data-theme="dark"]{
  --paper:#101215;
  --card:#171A1E;
  --sunk:#1D2126;
  --ink:#E9E9E5;
  --ink-2:#B6BBC1;
  --muted:#848A92;
  --faint:#5D646C;
  --line:#262A30;
  --line-2:#343941;
  --accent:#8FBBD6;
  --accent-hi:#B4D6EA;
  --accent-on:#0C1418;
  --accent-soft:rgba(143,187,214,.11);
  --accent-mid:rgba(143,187,214,.26);
  --accent-line:rgba(143,187,214,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 50px -22px rgba(0,0,0,.9);
  --danger:#D97A66;
  --c-color:#D79A6E;
  --c-material:#A3B283;
  --c-light:#DCC067;
  --c-object:#93A4C6;
  --c-structure:#77A296;
  --c-mood:#B392BB;
  --c-detail:#C48F8F;
  --c-etc:#9BA1A9;
  --graph-bg:#0C0E11;
  --graph-edge:rgba(233,233,229,.18);
  --graph-edge-soft:rgba(233,233,229,.07);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-weight:400;font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-mid)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── top bar ───────────────────────────────────────────── */
.bar{
  position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:60;
  display:flex;align-items:center;gap:18px;padding:0 16px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.mark{font-family:var(--f-display);font-size:21px;letter-spacing:.01em;line-height:1;white-space:nowrap;padding-right:2px}
.mark em{font-style:italic;color:var(--accent)}
.switch{display:flex;gap:2px;background:var(--sunk);border-radius:3px;padding:2px}
.switch button{
  font-size:12px;padding:5px 13px;border-radius:2px;color:var(--muted);
  letter-spacing:.02em;transition:color .15s,background .15s;
}
.switch button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.switch.sm button{font-size:11.5px;padding:4px 11px}
.bar .sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--line-2);border-radius:3px;background:var(--card);
  font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--accent-line);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:var(--accent-on)}
.btn.ghost{border-color:var(--line);background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk)}
.btn svg{width:13px;height:13px;flex:none}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:3px;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ── shell ─────────────────────────────────────────────── */
.shell{position:fixed;inset:var(--bar) 0 0 0;display:flex}
.rail{
  width:var(--rail);flex:none;border-right:1px solid var(--line);
  overflow-y:auto;padding:18px 0 40px;background:var(--paper);
}
.rail section{padding:0 16px;margin-bottom:24px}
.rail h2{margin:0 0 9px;display:flex;align-items:baseline;justify-content:space-between}
.search{position:relative}
.search input{
  width:100%;height:32px;padding:0 10px 0 28px;border:1px solid var(--line);
  background:var(--card);border-radius:3px;font-size:13px;
}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--faint)}
.cat{margin-bottom:14px}
.cat-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c-etc)}
.taglist{display:flex;flex-wrap:wrap;gap:4px}
.tg{
  display:inline-flex;align-items:center;gap:5px;max-width:100%;
  padding:3px 8px;border-radius:2px;border:1px solid var(--line);
  background:var(--card);font-size:12px;color:var(--ink-2);line-height:1.35;
  transition:border-color .13s,background .13s,color .13s;
}
.tg:hover{border-color:var(--accent-line);color:var(--ink)}
.tg .n{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.tg[aria-pressed="true"] .n{color:var(--accent-on);opacity:.7}
.tg[aria-pressed="true"] .dot{background:var(--accent-on)!important;opacity:.85}
.rail .empty-note{font-size:12.5px;color:var(--muted);line-height:1.7}
.rail-legal{margin:22px 16px 0;font-size:11.5px}
.rail-legal a{color:var(--muted);text-decoration:none}
.rail-legal a:hover{color:var(--ink-2);text-decoration:underline}

/* ── archive ───────────────────────────────────────────── */
.main{flex:1;overflow-y:auto;position:relative}
.pad{padding:26px 28px 90px;max-width:1500px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.head .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;min-height:0}
.chips:empty{display:none}
.grid{columns:4 268px;column-gap:16px}
@media (max-width:900px){.grid{columns:2 200px}}
.card{
  break-inside:avoid;margin:0 0 16px;background:var(--card);border:1px solid var(--line);
  border-radius:3px;overflow:hidden;cursor:pointer;position:relative;
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.card img{display:block;width:100%;height:auto;background:var(--sunk)}
.card .meta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px}
.card .t{font-size:13.5px;line-height:1.45;color:var(--ink);word-break:break-word}
.card .t.none{color:var(--faint)}
.card .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mini{
  font-size:11px;padding:2px 6px;border-radius:2px;background:var(--sunk);
  color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;line-height:1.4;
}
.mini .dot{width:5px;height:5px}
.pins{
  position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:2px;background:color-mix(in srgb,var(--card) 82%,transparent);
  backdrop-filter:blur(6px);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);
  border:1px solid var(--line);
}
.pins svg{width:10px;height:10px}

/* 부분 카드 */
.crop{width:100%;background-color:var(--sunk);background-repeat:no-repeat;display:block}
.card .memo{font-size:13px;line-height:1.65;color:var(--ink);word-break:break-word}
.card .memo.none{color:var(--faint)}
.card .from{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── empty state ───────────────────────────────────────── */
.blank{
  border:1px dashed var(--line-2);border-radius:4px;background:var(--card);
  padding:52px 40px;text-align:center;max-width:620px;margin:24px auto;
}
.blank h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 10px}
.blank p{color:var(--muted);margin:0 auto 22px;max-width:44ch;font-size:13.5px;line-height:1.75}
.blank .steps{display:grid;gap:10px;text-align:left;max-width:390px;margin:22px auto 0;padding-top:20px;border-top:1px solid var(--line)}
.blank .steps div{display:flex;gap:10px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.blank .steps b{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);padding-top:2px;flex:none}
.drop-on{position:fixed;inset:var(--bar) 0 0 0;z-index:80;background:var(--accent-soft);
  border:2px dashed var(--accent-line);display:grid;place-items:center;pointer-events:none}
.drop-on span{font-family:var(--f-display);font-size:26px;color:var(--accent)}

/* ── detail ────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;
  grid-template-columns:1fr 372px;grid-template-rows:var(--bar) 1fr}
.sheet-bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;
  border-bottom:1px solid var(--line);background:var(--paper)}
.stage{position:relative;overflow:hidden;background:var(--sunk);display:flex;
  align-items:center;justify-content:center;padding:24px}
.frame{position:relative;line-height:0;max-width:100%;max-height:100%;box-shadow:var(--shadow-lift)}
.frame img{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.layer{position:absolute;inset:0}
.layer.draw{cursor:crosshair}
.rg{position:absolute;border:1.5px solid var(--accent-line);background:var(--accent-soft);
  border-radius:1px;transition:background .15s,border-color .15s,box-shadow .15s}
.layer:not(.draw) .rg{cursor:pointer}
.rg:hover,.rg.on{background:var(--accent-mid);border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 0 0 9999px rgba(0,0,0,.06)}
.rg .num{position:absolute;top:-1px;left:-1px;min-width:17px;height:17px;padding:0 4px;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-on);
  font-family:var(--f-mono);font-size:10px;line-height:1;border-radius:1px 0 2px 0}
.rg.dim{opacity:.3}
/* 선택한 영역의 크기 조절 손잡이 */
.rg .h{
  position:absolute;width:12px;height:12px;background:var(--card);
  border:1.5px solid var(--accent);border-radius:2px;
  opacity:0;pointer-events:none;touch-action:none;
}
.rg.on .h{opacity:1;pointer-events:auto}
.layer.draw .rg .h{display:none}
.rg .h[data-h="nw"]{left:-6px;top:-6px;cursor:nwse-resize}
.rg .h[data-h="ne"]{right:-6px;top:-6px;cursor:nesw-resize}
.rg .h[data-h="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}
.rg .h[data-h="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}
.rg .h[data-h="n"]{left:50%;top:-6px;margin-left:-6px;cursor:ns-resize}
.rg .h[data-h="s"]{left:50%;bottom:-6px;margin-left:-6px;cursor:ns-resize}
.rg .h[data-h="w"]{top:50%;left:-6px;margin-top:-6px;cursor:ew-resize}
.rg .h[data-h="e"]{top:50%;right:-6px;margin-top:-6px;cursor:ew-resize}
.layer:not(.draw) .rg.on{cursor:move;touch-action:none}
.rg.editing{transition:none}
@media (max-width:820px){
  /* 손가락으로 잡기 좋게 */
  .rg .h{width:17px;height:17px}
  .rg .h[data-h="nw"]{left:-9px;top:-9px}
  .rg .h[data-h="ne"]{right:-9px;top:-9px}
  .rg .h[data-h="sw"]{left:-9px;bottom:-9px}
  .rg .h[data-h="se"]{right:-9px;bottom:-9px}
  .rg .h[data-h="n"]{top:-9px;margin-left:-9px}
  .rg .h[data-h="s"]{bottom:-9px;margin-left:-9px}
  .rg .h[data-h="w"]{left:-9px;margin-top:-9px}
  .rg .h[data-h="e"]{right:-9px;margin-top:-9px}
}
.marquee{position:absolute;border:1.5px dashed var(--accent);background:var(--accent-soft);pointer-events:none}
.stage-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  padding:6px 12px;border-radius:3px;background:color-mix(in srgb,var(--card) 90%,transparent);
  border:1px solid var(--line);font-size:12px;color:var(--muted);pointer-events:none;
  backdrop-filter:blur(6px);white-space:nowrap}

.panel{border-left:1px solid var(--line);overflow-y:auto;background:var(--paper);padding:20px 18px 60px}
.panel .grp{margin-bottom:26px}
.panel .grp>h3{margin:0 0 9px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ttl{width:100%;border:0;background:none;font-family:var(--f-display);font-size:25px;
  line-height:1.25;padding:0;margin:0 0 4px;resize:none;overflow:hidden}
.ttl::placeholder{color:var(--faint)}
.date{color:var(--muted);font-size:11px;letter-spacing:.06em}
.note{width:100%;border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:9px 10px;font-size:13px;line-height:1.65;resize:none;overflow:hidden;min-height:56px}
.note::placeholder{color:var(--faint)}
.note:focus{border-color:var(--accent-line);outline:none}

.tagfield{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px;
  border:1px solid var(--line);border-radius:3px;background:var(--card);min-height:36px}
.tagfield:focus-within{border-color:var(--accent-line)}
.tagfield input{flex:1;min-width:80px;border:0;background:none;outline:none;font-size:12.5px;padding:2px 4px}
.tagfield input::placeholder{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 5px 3px 7px;border-radius:2px;
  background:var(--sunk);font-size:12px;line-height:1.4}
.chip .x{width:13px;height:13px;display:grid;place-items:center;border-radius:2px;color:var(--faint);font-size:13px}
.chip .x:hover{background:var(--line-2);color:var(--ink)}
.sugs{position:relative}
.sugbox{position:absolute;z-index:20;left:0;right:0;top:2px;background:var(--card);
  border:1px solid var(--line-2);border-radius:3px;box-shadow:var(--shadow-lift);
  max-height:216px;overflow-y:auto;padding:3px}
.sugbox button{display:flex;width:100%;align-items:center;gap:7px;padding:6px 8px;
  border-radius:2px;font-size:12.5px;text-align:left}
.sugbox button:hover,.sugbox button.on{background:var(--sunk)}
.sugbox .k{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--faint)}

.rgitem{border:1px solid var(--line);border-radius:3px;background:var(--card);padding:9px 10px;
  margin-bottom:8px;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.rgitem:hover,.rgitem.on{border-color:var(--accent-line)}
.rgitem.on{box-shadow:0 0 0 1px var(--accent-line)}
.rgitem .top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.rgitem .num{min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-on);font-family:var(--f-mono);font-size:10px;border-radius:1px}
.rgitem .del{margin-left:auto;color:var(--faint);width:20px;height:20px;display:grid;place-items:center;border-radius:2px}
.rgitem .del:hover{color:var(--danger);background:var(--sunk)}
.rgitem .del svg{width:12px;height:12px}
.rgitem textarea{width:100%;border:0;background:none;resize:none;overflow:hidden;
  font-size:13px;line-height:1.6;padding:0;min-height:22px}
.rgitem textarea::placeholder{color:var(--faint)}

/* ── 빠른 담기 메뉴 (우클릭 / 길게 누르기) ─────────────── */
.ctxmenu{
  position:fixed;z-index:150;min-width:210px;max-width:290px;padding:5px;
  background:var(--card);border:1px solid var(--line-2);border-radius:5px;
  box-shadow:var(--shadow-lift);animation:ctxin .12s ease;
}
@keyframes ctxin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ctxmenu .ctxhead{
  padding:6px 9px 8px;margin-bottom:3px;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.4;

<div class="toasts" id="toasts"></div>
<script>
(function(){
"use strict";

/* ══ 카테고리 ══════════════════════════════════════════ */
const CATS = [
  {id:"color",     name:"색",          v:"--c-color",     sug:["웜톤","뉴트럴 베이지","올리브","딥그린","오프화이트","먹색"]},
  {id:"material",  name:"소재",        v:"--c-material",  sug:["오크","라임스톤","리넨","스테인리스","테라조","라탄"]},
  {id:"light",     name:"빛·조명",     v:"--c-light",     sug:["간접조명","자연광","펜던트","하이사이드라이트","촛불빛"]},
  {id:"object",    name:"가구·오브제", v:"--c-object",    sug:["라운지체어","로우 소파","빈티지 조명","도자기","책장"]},
  {id:"structure", name:"구조·배치",   v:"--c-structure", sug:["아치","높은 천장","오픈 플랜","단차","창가 자리"]},
  {id:"mood",      name:"분위기",      v:"--c-mood",      sug:["고요함","정돈됨","따뜻함","서늘함","오래된 느낌"]},
  {id:"detail",    name:"디테일",      v:"--c-detail",    sug:["몰딩","손잡이","모서리 처리","줄눈","마감선"]},
  {id:"etc",       name:"기타",        v:"--c-etc",       sug:[]}
];
const CATMAP = Object.fromEntries(CATS.map(c=>[c.id,c]));

/* ══ 아주 작은 유틸 ════════════════════════════════════ */
const $  = s=>document.querySelector(s);
const $$ = s=>Array.prototype.slice.call(document.querySelectorAll(s));
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>n<a?a:n>b?b:n;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtDate=ts=>{const d=new Date(ts);return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");};
function toast(msg,warn){
  const el=document.createElement("div");
  el.className="toast"+(warn?" warn":""); el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .3s";el.style.opacity="0";setTimeout(()=>el.remove(),320);},warn?3600:2100);
}
function autoGrow(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}

/* ══ 저장소 (IndexedDB) ════════════════════════════════ */
const DB_NAME="gusuk-archive", DB_VER=1;
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    let rq;
    try{ rq=indexedDB.open(DB_NAME,DB_VER); }catch(e){ return rej(e); }
    rq.onupgradeneeded=()=>{
      const d=rq.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("img")) d.createObjectStore("img");
    };
    rq.onsuccess=()=>{_db=rq.result;res(_db);};
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(store,mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    const r=fn(s);
    t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error);
  }));
}
const kvGet = k=>tx("kv","readonly",s=>s.get(k));
const kvPut = (k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const imgGet= k=>tx("img","readonly",s=>s.get(k));
const imgPut= (k,b)=>tx("img","readwrite",s=>s.put(b,k));
const imgDel= k=>tx("img","readwrite",s=>s.delete(k));

/* ══ 상태 ══════════════════════════════════════════════ */
let ST={v:1,seq:1,items:[],tags:[],spaces:[],boards:[]};
let URLS=new Map();      // imgKey -> objectURL
let IMGS=new Map();      // imgKey -> HTMLImageElement (그래프용)
let saveTimer=null, storageWarned=false;
const DIRTY=new Set();
const FOLDER_UI = (typeof window.showDirectoryPicker === "function");  /* standalone PWA: 지원 브라우저에서만 폴더 모드 */

function uid(p){ return p+(ST.seq++).toString(36)+Math.random().toString(36).slice(2,6); }
function save(item){
  if(Vault.ok){
    if(item) DIRTY.add(item.id); else ST.items.forEach(x=>DIRTY.add(x.id));
    clearTimeout(saveTimer);
    saveTimer=setTimeout(flushDirty,320);
    renderVaultUI();
    return;
  }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    kvPut("state",JSON.parse(JSON.stringify(ST))).catch(e=>{
      if(!storageWarned){storageWarned=true;toast("저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요.",true);}
      console.warn(e);
    });
  },220);
}
function urlFor(key){
  if(!key) return "";
  if(URLS.has(key)) return URLS.get(key);
  return "";
}
async function hydrateURLs(){
  for(const it of ST.items){
    const k=it.img&&it.img.key;
    if(!k||URLS.has(k)) continue;
    try{
      const blob=await imgGet(k);
      if(blob) URLS.set(k,URL.createObjectURL(blob));
    }catch(e){ console.warn("image load failed",k,e); }
  }
}

/* ══ 무드보드 ══════════════════════════════════════════
   재질과 색을 한자리에 펼쳐 놓고 보는 판. 프로젝트마다 하나씩 만든다.

   핀은 사진 전체이거나 그 안의 한 부분이다. 원본을 복사하지 않고
   가리키기만 하므로, 사진을 지우면 핀도 함께 사라진다. */
function boardById(id){ return (ST.boards||[]).find(b=>b.id===id); }
function ensureBoard(name){
  const clean=String(name||"").trim().replace(/\s+/g," ");
  if(!clean) return null;
  let b=(ST.boards||[]).find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(b) return b;
  b={id:uid("b"),name:clean,note:"",pins:[],createdAt:Date.now(),updatedAt:Date.now()};
  ST.boards=(ST.boards||[]).concat([b]);
  return b;
}
const pinKey=(itemId,regionId)=>itemId+"|"+(regionId||"");
function boardHas(b,itemId,regionId){
  return !!(b&&(b.pins||[]).some(p=>pinKey(p.item,p.region)===pinKey(itemId,regionId)));
}
function togglePin(b,itemId,regionId){
  if(!b) return false;
  b.pins=b.pins||[];
  const k=pinKey(itemId,regionId);
  const i=b.pins.findIndex(p=>pinKey(p.item,p.region)===k);
  if(i>=0) b.pins.splice(i,1);
  else b.pins.push({item:itemId,region:regionId||null});
  b.updatedAt=Date.now();
  saveBoards();
  return i<0;
}
/* 사라진 사진·부분을 가리키는 핀은 걷어낸다 */
function livePins(b){
  if(!b) return [];
  return (b.pins||[]).map(p=>{
    const it=ST.items.find(x=>x.id===p.item);
    if(!it) return null;
    if(!p.region) return {it:it,r:null};
    const r=(it.regions||[]).find(x=>x.id===p.region);
    return r?{it:it,r:r}:null;
  }).filter(Boolean);
}
function pruneBoards(){
  (ST.boards||[]).forEach(b=>{
    b.pins=(b.pins||[]).filter(p=>{
      const it=ST.items.find(x=>x.id===p.item);
      if(!it) return false;
      return !p.region || (it.regions||[]).some(r=>r.id===p.region);
    });
  });
}
let boardTimer=null;
function saveBoards(){
  if(Vault.ok){
    clearTimeout(boardTimer);
    boardTimer=setTimeout(()=>vaultWriteBoards(),400);
  }else save();
}

/* ══ 공간 ══════════════════════════════════════════════
   여러 장을 한 곳으로 묶는다. 같은 자리를 각도만 달리해 찍은 사진들처럼.

   성격이 갈린다 — 공간은 객관(어디, 언제, 무슨 마감재),
   사진은 주관(왜 좋았는지). 그래서 '사실' 필드는 공간에만 있다. */
function spaceById(id){ return (ST.spaces||[]).find(s=>s.id===id); }
function spaceByName(name){
  const n=String(name||"").trim().toLowerCase();
  return (ST.spaces||[]).find(s=>s.name.toLowerCase()===n);
}
function ensureSpace(name){
  const clean=String(name||"").trim().replace(/\s+/g," ");
  if(!clean) return null;
  let sp=spaceByName(clean);
  if(sp) return sp;
  sp={id:uid("s"),name:clean,note:"",facts:[],cover:null,
      createdAt:Date.now(),updatedAt:Date.now()};
  ST.spaces=(ST.spaces||[]).concat([sp]);
  return sp;
}
function spaceItems(id){
  return ST.items.filter(it=>it.space===id).sort((a,b)=>a.createdAt-b.createdAt);
}
function spaceCover(sp){
  const list=spaceItems(sp.id);
  if(sp.cover){ const c=list.find(x=>x.id===sp.cover); if(c) return c; }
  return list[0]||null;
}
/* 아무 사진도 남지 않은 공간은 치운다 (태그를 pruneTags 로 치우는 것과 같은 규칙) */
function pruneSpaces(){
  const used=new Set(ST.items.map(it=>it.space).filter(Boolean));
  ST.spaces=(ST.spaces||[]).filter(sp=>used.has(sp.id));
}

/* ══ 태그 ══════════════════════════════════════════════ */
function tagById(id){ return ST.tags.find(t=>t.id===id); }
function tagByName(name){ const n=name.trim().toLowerCase(); return ST.tags.find(t=>t.name.toLowerCase()===n); }
function ensureTag(name,cat){
  const clean=name.trim().replace(/\s+/g," ");
  if(!clean) return null;
  let t=tagByName(clean);
  if(t){ if(cat&&t.cat==="etc"&&cat!=="etc"){t.cat=cat;} return t; }
  if(!cat){
    const hit=CATS.find(c=>c.sug.some(s=>s.toLowerCase()===clean.toLowerCase()));
    cat=hit?hit.id:"etc";
  }
  t={id:uid("t"),name:clean,cat:cat};
  ST.tags.push(t);
  return t;
}
function itemTagIds(it){
  const s=new Set(it.tags||[]);
  (it.regions||[]).forEach(r=>(r.tags||[]).forEach(id=>s.add(id)));
  return Array.from(s);
}
function tagCount(id){ return ST.items.reduce((n,it)=>n+(itemTagIds(it).indexOf(id)>=0?1:0),0); }
function pruneTags(){
  const used=new Set();
  ST.items.forEach(it=>itemTagIds(it).forEach(id=>used.add(id)));
  ST.tags=ST.tags.filter(t=>used.has(t.id));
}
function catColor(catId){ return cssVar((CATMAP[catId]||CATMAP.etc).v)||"#888"; }

/* ══ 태그 고치기 ══════════════════════════════════════════
   오타를 고치거나 분류를 바로잡는다. 이미 붙은 곳에 전부 반영된다.

   주의: 볼트 모드에서 노트는 태그를 '이름'으로 저장한다. 그래서 이름을 바꾸면
   그 태그가 붙은 노트를 전부 다시 써야 한다. 안 그러면 다음 동기화 때
   옛 이름이 되살아난다. */
function itemsUsingTag(id){
  return ST.items.filter(it=>itemTagIds(it).indexOf(id)>=0);
}
async function persistTagChange(touched){
  if(Vault.ok){
    await vaultWriteTags();
    for(const it of touched){ it.updatedAt=Date.now(); await vaultWriteNote(it); }
  }else save();
}
/* 이름 바꾸기. 이미 있는 이름이면 그쪽으로 합친다. 성공하면 true */
function renameTag(id,nextName){
  const t=tagById(id); if(!t) return false;
  const clean=String(nextName||"").trim().replace(/\s+/g," ");
  if(!clean||clean===t.name) return false;
  const dup=ST.tags.find(x=>x.id!==id&&x.name.toLowerCase()===clean.toLowerCase());
  const touched=itemsUsingTag(id).slice();
  if(dup){
    /* 합치기 — 이 태그가 붙은 모든 자리를 기존 태그로 바꾼다 */
    const swap=ids=>{
      const out=(ids||[]).map(x=>x===id?dup.id:x);
      return out.filter((x,i)=>out.indexOf(x)===i);   /* 중복 제거 */
    };
    ST.items.forEach(it=>{
      it.tags=swap(it.tags);
      (it.regions||[]).forEach(r=>{ r.tags=swap(r.tags); });
    });
    ST.tags=ST.tags.filter(x=>x.id!==id);
    toast('"'+t.name+'" 을(를) "'+dup.name+'" 에 합쳤어요');
  }else{
    t.name=clean;
  }
  pruneTags();
  persistTagChange(touched);
  renderRail(); renderArchive(); graphDirty();
  if(sheetEl&&!sheetEl.hidden&&CUR) renderPanel();
  return true;
}
function retagCategory(id,cat){
  const t=tagById(id); if(!t||!CATMAP[cat]||t.cat===cat) return;
  t.cat=cat;
  persistTagChange([]);          /* 분류는 tags.json 에만 있다 */
  renderRail(); renderArchive(); graphDirty();
  if(sheetEl&&!sheetEl.hidden&&CUR) renderPanel();
}
function deleteTagEverywhere(id){
  const t=tagById(id); if(!t) return;
  const touched=itemsUsingTag(id).slice();
  ST.items.forEach(it=>{
    it.tags=(it.tags||[]).filter(x=>x!==id);
    (it.regions||[]).forEach(r=>{ r.tags=(r.tags||[]).filter(x=>x!==id); });
  });
  ST.tags=ST.tags.filter(x=>x.id!==id);
  persistTagChange(touched);
  renderRail(); renderArchive(); graphDirty();
  if(sheetEl&&!sheetEl.hidden&&CUR) renderPanel();
  toast('"'+t.name+'" 태그를 지웠어요');
}

/* ══ 필터 상태 ════════════════════════════════════════ */
let FILTER={q:"",tags:new Set(),mode:"or"};
let MODE="photo";

function itemMatches(it){
  if(FILTER.tags.size){
    const ids=itemTagIds(it);
    if(FILTER.mode==="and"){
      for(const t of FILTER.tags) if(ids.indexOf(t)<0) return false;
    }else{
      let any=false; for(const t of FILTER.tags) if(ids.indexOf(t)>=0){any=true;break;}
      if(!any) return false;
    }
  }
  const q=FILTER.q.trim().toLowerCase();
  if(q){
    const hay=[it.title||"",it.note||""]
      .concat((it.regions||[]).map(r=>r.text||""))
      .concat(itemTagIds(it).map(id=>{const t=tagById(id);return t?t.name:"";}))
      .join(" ").toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function filtered(){ return ST.items.filter(itemMatches).sort((a,b)=>b.createdAt-a.createdAt); }

function regionMatches(it,r){
  const ids=new Set((r.tags||[]).concat(it.tags||[]));
  if(FILTER.tags.size){
    if(FILTER.mode==="and"){ for(const t of FILTER.tags) if(!ids.has(t)) return false; }
    else { let any=false; for(const t of FILTER.tags) if(ids.has(t)){any=true;break;} if(!any) return false; }
  }
  const q=FILTER.q.trim().toLowerCase();
  if(q){
    const hay=[r.text||"",it.title||"",it.note||""]
      .concat(Array.from(ids).map(id=>{const t=tagById(id);return t?t.name:"";}))
      .join(" ").toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function filteredRegions(){
  const out=[];
  ST.items.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(it=>{
    (it.regions||[]).forEach((r,i)=>{ if(regionMatches(it,r)) out.push({it:it,r:r,i:i}); });
  });
  return out;
}

/* ══ 사진 처리 ════════════════════════════════════════ */
let WEBP=null;
function webpOK(){
  if(WEBP!==null) return WEBP;
  try{
    const c=document.createElement("canvas");c.width=c.height=1;
    WEBP=c.toDataURL("image/webp").indexOf("data:image/webp")===0;
  }catch(e){ WEBP=false; }
  return WEBP;
}
const MAX_EDGE=1800;
function loadImage(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im); im.onerror=()=>rej(new Error("이미지를 읽지 못했어요"));
    im.src=src;
  });
}
async function processFile(file){
  const raw=URL.createObjectURL(file);
  let im;
  try{ im=await loadImage(raw); }
  finally{ /* revoke after draw */ }
  const scale=Math.min(1,MAX_EDGE/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(1,Math.round(im.naturalWidth*scale)), h=Math.max(1,Math.round(im.naturalHeight*scale));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(im,0,0,w,h);
  URL.revokeObjectURL(raw);
  const type=webpOK()?"image/webp":"image/jpeg";
  const blob=await new Promise(res=>c.toBlob(res,type,0.85));
  return {blob:blob||file,w:w,h:h,ext:(webpOK()?"webp":"jpg")};
}
async function addFiles(files){
  const list=Array.prototype.slice.call(files).filter(f=>/^image\//.test(f.type));
  if(!list.length){ toast("이미지 파일만 올릴 수 있어요.",true); return; }
  let added=0, firstId=null;
  for(const f of list){
    try{
      const {blob,w,h,ext}=await processFile(f);
      const it={
        id:uid("p"),
        title:f.name.replace(/\.[a-z0-9]+$/i,"").slice(0,80),
        note:"", tags:[], regions:[], links:[], space:null,
        img:null, createdAt:Date.now()+added, updatedAt:Date.now()
      };
      if(Vault.ok){
        it.img={key:it.id,file:null,w:w,h:h};
        await vaultWriteImage(it,blob,ext);
        URLS.set(it.id,URL.createObjectURL(blob));
      }else{
        const key=uid("i");
        await imgPut(key,blob);
        URLS.set(key,URL.createObjectURL(blob));
        it.img={key:key,w:w,h:h};
      }
      ST.items.push(it);
      if(!firstId) firstId=it.id;
      added++;
    }catch(e){ console.warn(e); toast(f.name+" 은(는) 불러오지 못했어요.",true); }
  }
  if(added){
    save(); renderAll();
    toast(added+"장을 담았어요");
    if(added===1&&firstId) openItem(firstId);
  }
}
async function deleteItem(id){
  const i=ST.items.findIndex(x=>x.id===id);
  if(i<0) return;
  const it=ST.items[i];
  ST.items.splice(i,1);
  ST.items.forEach(o=>{ o.links=(o.links||[]).filter(l=>l!==id); });
  const key=it.img&&it.img.key;
  if(key){ const u=URLS.get(key); if(u) URL.revokeObjectURL(u); URLS.delete(key); IMGS.delete(key); }
  pruneTags(); pruneSpaces(); pruneBoards();
  if(Vault.ok){ await vaultDeleteItem(it); await vaultWriteTags(); await vaultWriteSpaces(); await vaultWriteBoards(); }
  else { if(key){ try{await imgDel(key);}catch(e){} } save(); }
  renderAll();
  toast("한 장을 지웠어요");
}

/* ══ 빠른 담기 ═════════════════════════════════════════
   생각났을 때 바로 담을 수 있어야 한다. 세 갈래로 열어둔다.

function closeCtx(){

/* ══ 무드보드 화면 ═════════════════════════════════════
   글자를 걷어내고 재질과 색만 남긴다. 조합을 눈으로 판단하는 화면이다. */
let CURBOARD=null;          /* 지금 보고 있는 보드 id */
let SWATCH=190;             /* 조각 크기(px) */
const PALCACHE=new Map();   /* 핀 -> 대표색들. 계산이 비싸니 기억해둔다 */

/* 한 핀에서 대표색을 뽑는다. 부분이면 그 부분만 잘라서 본다. */
function pinPalette(pin){
  const key=pinKey(pin.it.id, pin.r&&pin.r.id);
  if(PALCACHE.has(key)) return PALCACHE.get(key);
  const im=imgEl(pin.it.img&&pin.it.img.key);
  if(!im||!im.complete||!im.naturalWidth) return null;   /* 아직 안 실림 — 나중에 다시 */
  const N=48;
  const cv=document.createElement("canvas"); cv.width=cv.height=N;
  const g=cv.getContext("2d",{willReadFrequently:true});
  let data;
  try{
    if(pin.r){
      const iw=im.naturalWidth, ih=im.naturalHeight;
      g.drawImage(im, pin.r.x*iw, pin.r.y*ih,
        Math.max(1,pin.r.w*iw), Math.max(1,pin.r.h*ih), 0,0,N,N);
    }else g.drawImage(im,0,0,N,N);
    data=g.getImageData(0,0,N,N).data;
  }catch(e){ return null; }
  const px=new Float64Array(N*N*3);
  for(let i=0,j=0;i<data.length;i+=4,j+=3){ px[j]=data[i];px[j+1]=data[i+1];px[j+2]=data[i+2]; }
  const out=dominant(px,4,7).filter(c=>c.share>0.08)
    .map(c=>({hex:toHex(c.rgb),share:c.share,rgb:c.rgb}));
  PALCACHE.set(key,out);
  return out;
}

/* 담긴 조각 전부에서 팔레트를 모은다. 가까운 색은 합쳐서 비율을 더한다. */
function boardPalette(pins){
  const bins=[];
  let pending=false;
  for(const pin of pins){
    const cols=pinPalette(pin);
    if(cols===null){ pending=true; continue; }
    for(const c of cols){
      let hit=null;
      for(const b of bins){
        const d=Math.hypot(b.rgb[0]-c.rgb[0],b.rgb[1]-c.rgb[1],b.rgb[2]-c.rgb[2]);
        if(d<34){ hit=b; break; }
      }
      if(hit){
        const w=hit.share+c.share;
        hit.rgb=[0,1,2].map(k=>(hit.rgb[k]*hit.share+c.rgb[k]*c.share)/w);
        hit.share=w;
      }else bins.push({rgb:c.rgb.slice(),share:c.share});
    }
  }
  bins.sort((a,b)=>b.share-a.share);
  const top=bins.slice(0,9);
  const tot=top.reduce((n,b)=>n+b.share,0)||1;
  return {pending:pending, colors:top.map(b=>({hex:toHex(b.rgb),pct:b.share/tot}))};
}

function boardTagSummary(pins){
  const by={};
  pins.forEach(p=>{
    const ids=p.r? Array.from(new Set((p.r.tags||[]).concat(p.it.tags||[]))) : itemTagIds(p.it);
    ids.forEach(id=>{
      const t=tagById(id); if(!t) return;
      by[t.cat]=by[t.cat]||{};
      by[t.cat][t.name]=(by[t.cat][t.name]||0)+1;
    });
  });
  return CATS.filter(c=>by[c.id]).map(c=>({cat:c,
    tags:Object.entries(by[c.id]).sort((a,b)=>b[1]-a[1])}));
}

/* 보드를 한 장의 그림으로 저장한다 — 색 띠 + 조각들.
   화면과 같은 구성이되 글자는 최소로. 시공사·친구에게 그대로 보낼 수 있게. */
async function exportBoard(b,pins){
  if(!pins.length){ toast("담긴 게 없어요.",true); return; }
  const COLS=Math.min(4,Math.max(2,Math.round(Math.sqrt(pins.length))));
  const CELL=420, GAP=16, PAD=40, BAR=90;
  const rows=Math.ceil(pins.length/COLS);
  const W=PAD*2+COLS*CELL+(COLS-1)*GAP;
  const H=PAD*2+BAR+GAP+rows*CELL+(rows-1)*GAP+56;
  const cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle="#EDECE6"; g.fillRect(0,0,W,H);

  /* 색 띠 */
  const pal=boardPalette(pins);
  let x=PAD;
  const barW=W-PAD*2;
  pal.colors.forEach(c=>{
    const w=Math.max(28,barW*c.pct);
    g.fillStyle=c.hex; g.fillRect(x,PAD,w,BAR);
    x+=w;
  });
  if(pal.colors.length){
    g.strokeStyle="rgba(27,28,26,.15)"; g.lineWidth=1;
    g.strokeRect(PAD+.5,PAD+.5,Math.min(barW,x-PAD)-1,BAR-1);
  }

  /* 조각들 */
  for(let i=0;i<pins.length;i++){
    const p=pins[i];
    const cx=PAD+(i%COLS)*(CELL+GAP);
    const cy=PAD+BAR+GAP+Math.floor(i/COLS)*(CELL+GAP);
    const im=imgEl(p.it.img&&p.it.img.key);
    g.save();
    g.beginPath(); g.rect(cx,cy,CELL,CELL); g.clip();
    g.fillStyle="#E3E3DE"; g.fillRect(cx,cy,CELL,CELL);
    if(im&&im.complete&&im.naturalWidth){
      const iw=im.naturalWidth, ih=im.naturalHeight;
      const sx=p.r?p.r.x*iw:0, sy=p.r?p.r.y*ih:0;
      const sw=p.r?Math.max(1,p.r.w*iw):iw, sh=p.r?Math.max(1,p.r.h*ih):ih;
      const sc=Math.max(CELL/sw,CELL/sh);
      g.drawImage(im,sx,sy,sw,sh,
        cx+CELL/2-sw*sc/2, cy+CELL/2-sh*sc/2, sw*sc, sh*sc);
    }
    g.restore();
    g.strokeStyle="rgba(27,28,26,.18)"; g.lineWidth=1;
    g.strokeRect(cx+.5,cy+.5,CELL-1,CELL-1);
  }

  /* 이름 */
  g.fillStyle="#1B1C1A";
  g.font='500 26px "IBM Plex Sans KR","IBM Plex Sans",sans-serif';
  g.textBaseline="alphabetic";
  g.fillText(b.name, PAD, H-PAD+8);
  g.fillStyle="#8A9099";
  g.font='400 18px "IBM Plex Mono",monospace';
  const stamp=new Date().toISOString().slice(0,10);
  g.fillText(pins.length+"조각 · "+stamp, PAD, H-PAD+34);

  const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
  if(!blob){ toast("이미지를 만들지 못했어요.",true); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=b.name.replace(/[\\/:*?"<>|]/g,"")+"-무드보드.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("이미지로 저장했어요");
}

function newBoardPrompt(){
  const name=prompt("새 보드 이름 (예: 성수동 프로젝트)");
  if(name===null) return;
  const b=ensureBoard(name);
  if(!b){ toast("이름을 적어주세요.",true); return; }
  CURBOARD=b.id; saveBoards(); renderBoard();
}

function wireBoard(b,pins){
  const box=$("#board");
  const on=(id,ev,fn)=>{ const el=box.querySelector(id); if(el) el.addEventListener(ev,fn); };
  on("#bPick","change",e=>{ CURBOARD=e.target.value; renderBoard(); });
  on("#bNew","click",newBoardPrompt);
  on("#bRename","click",()=>{
    const n=prompt("보드 이름",b.name);
    if(n===null) return;
    const clean=String(n).trim();
    if(!clean) return;
    b.name=clean; b.updatedAt=Date.now(); saveBoards(); renderBoard();
  });
  on("#bDel","click",()=>{
    if(!confirm('"'+b.name+'" 보드를 지웁니다. 사진과 메모는 그대로 남아요.')) return;
    ST.boards=(ST.boards||[]).filter(x=>x.id!==b.id);
    CURBOARD=null; saveBoards(); renderBoard();
  });
  on("#bSize","input",e=>{
    SWATCH=+e.target.value;
    const g=box.querySelector(".bgrid");
    if(g) g.style.setProperty("--sw",SWATCH+"px");
  });
  on("#bExport","click",()=>exportBoard(b,pins));
  box.querySelectorAll("[data-unpin]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const p=pins[+btn.dataset.unpin];
      if(p) togglePin(b,p.it.id,p.r&&p.r.id);
      renderBoard();
    });
  });
  box.querySelectorAll("[data-pin]").forEach(fig=>{
    fig.addEventListener("click",()=>{
      const p=pins[+fig.dataset.pin];
      if(p) openItem(p.it.id,p.r&&p.r.id);
    });
  });
}

function renderChips(){

function cardHTML(it){
  const ids=itemTagIds(it);
  const tg=ids.slice(0,4).map(id=>{const t=tagById(id);if(!t)return"";
    return '<span class="mini"><i class="dot" style="background:var('+CATMAP[t.cat].v+')"></i>'+esc(t.name)+'</span>';}).join("");
  const more=ids.length>4?'<span class="mini">+'+(ids.length-4)+'</span>':"";
  const n=(it.regions||[]).length;
  const ratio=it.img&&it.img.w?(it.img.h/it.img.w*100):66;
  const title=it.title?'<div class="t">'+esc(it.title)+'</div>':'<div class="t none">제목 없음</div>';
  return '<article class="card" data-open="'+it.id+'" tabindex="0">'+
    pinBtnHTML(it.id,null)+
    (n?'<div class="pins"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="9" rx="1"/><rect x="5" y="6" width="5" height="4" rx=".5" fill="currentColor" opacity=".35"/></svg>'+n+'</div>':"")+
    '<img loading="lazy" src="'+urlFor(it.img&&it.img.key)+'" alt="" style="aspect-ratio:'+(it.img&&it.img.w? it.img.w+"/"+it.img.h : "3/2")+'">'+
    '<div class="meta">'+title+(tg||more?'<div class="row">'+tg+more+'</div>':"")+'</div></article>';
}
function cropStyle(it,r){
  const bx=(1-r.w)<=0.0001?0:(r.x/(1-r.w))*100;
  const by=(1-r.h)<=0.0001?0:(r.y/(1-r.h))*100;
  const iw=(it.img&&it.img.w)||3, ih=(it.img&&it.img.h)||2;
  const ratio=(r.w*iw)/Math.max(1,(r.h*ih));
  return 'background-image:url('+urlFor(it.img&&it.img.key)+');'+
    'background-size:'+(100/Math.max(.001,r.w))+'% '+(100/Math.max(.001,r.h))+'%;'+
    'background-position:'+bx.toFixed(3)+'% '+by.toFixed(3)+'%;'+
    'aspect-ratio:'+ratio.toFixed(4);
}
function regionCardHTML(o){
  const ids=Array.from(new Set((o.r.tags||[]).concat(o.it.tags||[])));
  const tg=ids.slice(0,4).map(id=>{const t=tagById(id);if(!t)return"";
    return '<span class="mini"><i class="dot" style="background:var('+CATMAP[t.cat].v+')"></i>'+esc(t.name)+'</span>';}).join("");
  const memo=o.r.text? '<div class="memo">'+esc(o.r.text)+'</div>' : '<div class="memo none">메모 없음</div>';
  return '<article class="card" data-open="'+o.it.id+'" data-rgsel="'+o.r.id+'" tabindex="0">'+
    '<div class="pins">'+(o.i+1)+'</div>'+
    pinBtnHTML(o.it.id,o.r.id)+
    '<div class="crop" style="'+cropStyle(o.it,o.r)+
      ((o.r.path&&o.r.path.length>2)?';clip-path:'+pathToClip(o.r.path):"")+'"></div>'+
    '<div class="meta">'+memo+(tg?'<div class="row">'+tg+'</div>':"")+
    '<div class="from">'+esc(o.it.title||"제목 없음")+'</div></div></article>';
}

/* 공간 안에 들어왔을 때 위에 뜨는 머리말 — 이름·메모·사실을 여기서 고친다 */

      '<h3><span class="lbl">사실</span><span class="lbl" style="opacity:.7">치수·마감재·시기처럼 취향이 아닌 것</span></h3>'+

function renderArchive(){
  const total=ST.items.length;
  const regionsAll=ST.items.reduce((n,it)=>n+(it.regions||[]).length,0);
  const activeTags=Array.from(FILTER.tags).map(id=>{const t=tagById(id);return t?t.name:"";}).filter(Boolean);
  $("#viewTitle").textContent = activeTags.length ? activeTags.join(FILTER.mode==="and"?" + ":" · ")
    : (FILTER.q.trim()? "‘"+FILTER.q.trim()+"’ 검색" : (MODE==="region"?"좋아하는 부분":"모든 구석"));
  $("#stat").textContent = total? total+" 장" : "";
  $$("#modeSw button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===MODE?"true":"false"));
  $("#modeSw").hidden = total===0;
  renderVaultUI();
  renderChips();
  const wrap=$("#gridWrap");
  if(!total){ $("#viewSub").textContent="아직 기록이 없어요";
    wrap.innerHTML=(FOLDER_UI&&!Vault.ok)?"":blankHTML(); return; }

  if(MODE==="region"){
    const list=filteredRegions();
    $("#viewSub").textContent = list.length===regionsAll ? "메모 "+regionsAll+"개"
      : list.length+"개 / 전체 메모 "+regionsAll+"개";
    if(!regionsAll){
      wrap.innerHTML='<div class="blank"><h3>아직 표시한 부분이 없어요</h3><p>사진을 열고 <b style="font-weight:500;color:var(--ink-2)">좋아하는 부분 표시</b>를 켜서 마음에 든 자리를 감싸보세요. 그 조각들만 여기 모입니다.</p></div>';
      return;
    }
    if(!list.length){
      wrap.innerHTML='<div class="blank"><h3>여기엔 아직 없네요</h3><p>다른 태그를 골라보거나 검색어를 지워보세요.</p></div>';
      return;
    }
    wrap.innerHTML='<div class="grid">'+list.map(regionCardHTML).join("")+'</div>';
    updateBulkBtn();
    return;
  }

  const list=filtered();

  /* 공간 안에 들어와 있으면 그 공간의 사진만 낱장으로 */
  if(INSPACE){
    const sp=spaceById(INSPACE);
    if(!sp){ INSPACE=null; renderArchive(); return; }
    const mine=list.filter(it=>it.space===sp.id);
    $("#viewTitle").textContent=sp.name;
    $("#viewSub").textContent=mine.length+"장";
    wrap.innerHTML=spaceHeadHTML(sp)+
      (mine.length? '<div class="grid">'+mine.map(cardHTML).join("")+'</div>'
                  : '<div class="blank"><h3>이 공간엔 아직 없네요</h3><p>거른 조건을 지우면 다시 보일 수 있어요.</p></div>');
    wireSpaceHead(sp);
    return;
  }

  $("#viewSub").textContent = list.length===total ? total+"장 · 메모 "+regionsAll+"개"
    : list.length+"장 / 전체 "+total+"장";
  if(!list.length){
    wrap.innerHTML='<div class="blank"><h3>여기엔 아직 없네요</h3><p>다른 태그를 골라보거나 검색어를 지워보세요.</p></div>';
    return;
  }

  /* 공간에 묶인 사진은 낱장이 아니라 공간 카드 하나로 보여준다 */
  const cards=[]; const seen=new Set();
  for(const it of list){
    if(!it.space){ cards.push({t:it.createdAt,html:cardHTML(it)}); continue; }
    if(seen.has(it.space)) continue;
    seen.add(it.space);
    const sp=spaceById(it.space);
    if(!sp){ cards.push({t:it.createdAt,html:cardHTML(it)}); continue; }
    const shown=list.filter(x=>x.space===sp.id).length;
    const all=spaceItems(sp.id).length;
    cards.push({t:it.createdAt,html:spaceCardHTML(sp,shown,all)});
  }
  cards.sort((a,b)=>b.t-a.t);
  wrap.innerHTML='<div class="grid">'+cards.map(c=>c.html).join("")+'</div>';
  updateBulkBtn();
}

function wireSpaceHead(sp){
  const wrap=$("#gridWrap");
  const back=wrap.querySelector("[data-back]");
  if(back) back.addEventListener("click",()=>{ INSPACE=null; renderArchive(); });
  const nm=wrap.querySelector("#spName");
  if(nm) nm.addEventListener("input",()=>{
    const v=nm.value.trim();
    if(!v) return;
    sp.name=v; sp.updatedAt=Date.now();
    saveSpaces();
  });
  const nt=wrap.querySelector("#spNote");
  if(nt){ autoGrow(nt); nt.addEventListener("input",()=>{
    autoGrow(nt); sp.note=nt.value; sp.updatedAt=Date.now(); saveSpaces();
  }); }
  const add=wrap.querySelector("#addFact");
  if(add) add.addEventListener("click",()=>{
    sp.facts=(sp.facts||[]).concat([{k:"",v:""}]);
    saveSpaces(); renderArchive();
    const rows=$("#factList");
    const last=rows&&rows.lastElementChild;
    if(last) last.querySelector(".fk").focus();
  });
  wrap.querySelectorAll(".factrow").forEach(row=>{
    const i=+row.dataset.fi;
    row.querySelector(".fk").addEventListener("input",e=>{ sp.facts[i].k=e.target.value; saveSpaces(); });
    row.querySelector(".fv").addEventListener("input",e=>{ sp.facts[i].v=e.target.value; saveSpaces(); });
    row.querySelector("[data-delfact]").addEventListener("click",()=>{
      sp.facts.splice(i,1); saveSpaces(); renderArchive();
    });
  });
}

/* 공간 정보는 사진 노트가 아니라 spaces.json 에 있다 */
let spTimer=null;
function saveSpaces(){
  if(Vault.ok){
    clearTimeout(spTimer);
    spTimer=setTimeout(()=>vaultWriteSpaces(),400);
  }else save();
}
function blankHTML(){
  return '<div class="blank"><h3>첫 장면을 담아보세요</h3>'+
   '<p>마음이 머문 공간 사진을 올리고, 어디가 좋았는지 그 부분만 네모로 감싸 메모를 남기면 됩니다. 이 아카이브는 Sarah님만 볼 수 있어요.</p>'+

   '<div><b>02</b><span>좋았던 부분을 드래그해 감싸고, 그 자리에 메모를 남긴다.</span></div>'+
   '<div><b>03</b><span>색·소재·빛처럼 이유가 되는 단어를 태그로 붙인다.</span></div>'+

/* ══ 폴더 저장소 (옵시디언 방식) ═══════════════════════ */
const Vault={dir:null,ok:false,name:"",busy:0,lastSync:0,seen:new Map(),tagsSeen:0,spacesSeen:0,boardsSeen:0,timer:null,loading:false};
const FS_OK = typeof window.showDirectoryPicker === "function";

function tagNames(ids){
  return (ids||[]).map(id=>{const t=tagById(id);return t?t.name:null;}).filter(Boolean);
}
function tagIds(names){
  return (names||[]).map(n=>{const t=ensureTag(String(n));return t?t.id:null;}).filter(Boolean);
}
function noteFromItem(it){
  const sp=it.space?spaceById(it.space):null;
  return {app:"gusuk",v:1,id:it.id,
    title:it.title||"",note:it.note||"",
    space:sp?sp.name:null,   /* id 가 아니라 이름으로 — 태그와 같은 이유 */
    tags:tagNames(it.tags),
    regions:(it.regions||[]).map(r=>{
      const o={id:r.id,x:r.x,y:r.y,w:r.w,h:r.h,text:r.text||"",tags:tagNames(r.tags)};
      if(r.path&&r.path.length>2) o.path=r.path;   /* 자동 선택한 면의 윤곽 */
      return o;
    }),
    links:it.links||[],
    image:it.img?{file:it.img.file||null,w:it.img.w,h:it.img.h}:null,
    createdAt:it.createdAt,updatedAt:it.updatedAt||Date.now()};
}
function itemFromNote(d){
  const sp=d.space?ensureSpace(d.space):null;
  return {id:d.id,title:d.title||"",note:d.note||"",
    space:sp?sp.id:null,
    tags:tagIds(d.tags),
    regions:(d.regions||[]).map(r=>({id:r.id,x:+r.x,y:+r.y,w:+r.w,h:+r.h,text:r.text||"",
      path:Array.isArray(r.path)?r.path:null,tags:tagIds(r.tags)})),
    links:Array.isArray(d.links)?d.links:[],
    img:{key:d.id,file:(d.image&&d.image.file)||null,w:(d.image&&d.image.w)||3,h:(d.image&&d.image.h)||2},
    createdAt:d.createdAt||Date.now(),updatedAt:d.updatedAt||0};
}
async function subDir(name,create){
  return Vault.dir.getDirectoryHandle(name,{create:create!==false});
}
async function writeText(dirH,name,text){
  const fh=await dirH.getFileHandle(name,{create:true});
  const w=await fh.createWritable();
  await w.write(text); await w.close();
  try{ return (await fh.getFile()).lastModified; }catch(e){ return Date.now(); }
}
async function writeBlob(dirH,name,blob){
  const fh=await dirH.getFileHandle(name,{create:true});
  const w=await fh.createWritable();
  await w.write(blob); await w.close();
}

async function vaultWriteNote(it){
  if(!Vault.ok||!it) return;
  Vault.busy++;
  try{
    it.updatedAt=Date.now();
    const notes=await subDir("notes");
    const lm=await writeText(notes,it.id+".json",JSON.stringify(noteFromItem(it),null,1));
    Vault.seen.set(it.id+".json",lm);
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
async function vaultWriteTags(){
  if(!Vault.ok) return;
  Vault.busy++;
  try{
    const payload={app:"gusuk",v:1,updatedAt:Date.now(),
      tags:ST.tags.map(t=>({name:t.name,cat:t.cat}))};
    Vault.tagsSeen=await writeText(Vault.dir,"tags.json",JSON.stringify(payload,null,1));
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
async function vaultWriteSpaces(){
  if(!Vault.ok) return;
  Vault.busy++;
  try{
    const payload={app:"gusuk",v:1,updatedAt:Date.now(),
      spaces:(ST.spaces||[]).map(sp=>({name:sp.name,note:sp.note||"",
        facts:(sp.facts||[]).map(f=>({k:f.k,v:f.v}))}))};
    Vault.spacesSeen=await writeText(Vault.dir,"spaces.json",JSON.stringify(payload,null,1));
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
/* spaces.json 은 이름·메모·사실만 담는다. 어떤 사진이 어느 공간인지는
   각 노트의 space 필드가 진실이다 — 한 곳에만 적어야 어긋나지 않는다. */
function applySpaceMeta(list){
  (list||[]).forEach(rec=>{
    if(!rec||!rec.name) return;
    const sp=ensureSpace(rec.name);
    if(!sp) return;
    sp.note=rec.note||"";
    sp.facts=Array.isArray(rec.facts)?rec.facts.filter(f=>f&&f.k).map(f=>({k:String(f.k),v:String(f.v||"")})):[];
  });
}

async function vaultWriteBoards(){
  if(!Vault.ok) return;
  Vault.busy++;
  try{
    const payload={app:"gusuk",v:1,updatedAt:Date.now(),
      boards:(ST.boards||[]).map(b=>({name:b.name,note:b.note||"",
        pins:(b.pins||[]).map(p=>({item:p.item,region:p.region||null}))}))};
    Vault.boardsSeen=await writeText(Vault.dir,"boards.json",JSON.stringify(payload,null,1));
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
function applyBoards(list){
  const keep=new Map((ST.boards||[]).map(b=>[b.name,b]));
  ST.boards=(list||[]).filter(b=>b&&b.name).map(b=>{
    const old=keep.get(b.name);
    return {id:old?old.id:uid("b"),name:b.name,note:b.note||"",
      pins:Array.isArray(b.pins)?b.pins.filter(p=>p&&p.item)
        .map(p=>({item:String(p.item),region:p.region||null})):[],
      createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};
  });
  pruneBoards();
}

async function vaultWriteImage(it,blob,ext){
  if(!Vault.ok) return;
  Vault.busy++;
  try{
    const imgs=await subDir("images");
    const name=it.id+"."+ext;
    await writeBlob(imgs,name,blob);
    it.img.file=name;
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
async function vaultDeleteItem(it){
  if(!Vault.ok) return;
  Vault.busy++;
  try{
    const notes=await subDir("notes");
    try{ await notes.removeEntry(it.id+".json"); }catch(e){}
    Vault.seen.delete(it.id+".json");
    if(it.img&&it.img.file){
      const imgs=await subDir("images");
      try{ await imgs.removeEntry(it.img.file); }catch(e){}
    }
  }catch(e){ vaultTrouble(e); }
  finally{ Vault.busy--; }
}
function vaultTrouble(e){
  console.warn(e);
  if(e&&(e.name==="NotAllowedError"||e.name==="SecurityError")){
    Vault.ok=false; renderVaultUI();
    toast("폴더 권한이 끊겼어요. 폴더를 다시 연결해 주세요.",true);
  }else toast("폴더에 저장하지 못했어요: "+(e&&e.message||e),true);
}

/* 폴더 → 메모리 */
async function vaultLoadAll(){
  Vault.loading=true; renderVaultUI();
  const tags=[],items=[];
  try{
    const fh=await Vault.dir.getFileHandle("tags.json");
    const f=await fh.getFile(); Vault.tagsSeen=f.lastModified;
    const d=JSON.parse(await f.text());
    (d.tags||[]).forEach(t=>tags.push(t));
  }catch(e){ /* 아직 없음 */ }
  let spaceMeta=[];
  try{
    const fh=await Vault.dir.getFileHandle("spaces.json");
    const f=await fh.getFile(); Vault.spacesSeen=f.lastModified;
    const d=JSON.parse(await f.text());
    spaceMeta=d.spaces||[];
  }catch(e){ /* 아직 없음 */ }
  ST.tags=[]; ST.spaces=[]; Vault.seen.clear();
  tags.forEach(t=>ensureTag(t.name,t.cat));
  applySpaceMeta(spaceMeta);
  let broken=[];
  try{
    const notes=await subDir("notes");
    for await (const [name,h] of notes.entries()){
      if(h.kind!=="file"||!/\.json$/i.test(name)) continue;
      try{
        const f=await h.getFile();
        const d=JSON.parse(await f.text());
        if(!d||!d.id){ broken.push(name); continue; }
        if(name!==d.id+".json"){ broken.push(name); continue; }
        items.push(itemFromNote(d));
        Vault.seen.set(name,f.lastModified);
      }catch(e){ broken.push(name); }
    }
  }catch(e){ /* notes 폴더 없음 = 빈 아카이브 */ }
  ST.items=items.sort((a,b)=>a.createdAt-b.createdAt);
  pruneTags(); pruneSpaces();
  applySpaceMeta(spaceMeta);   /* 노트가 만든 공간에 메모·사실을 다시 입힌다 */
  try{
    const bh=await Vault.dir.getFileHandle("boards.json");
    const bf=await bh.getFile(); Vault.boardsSeen=bf.lastModified;
    applyBoards((JSON.parse(await bf.text())||{}).boards||[]);
  }catch(e){ ST.boards=ST.boards||[]; }
  Vault.lastSync=Date.now(); Vault.loading=false;
  renderAll(); renderVaultUI();
  if(broken.length) toast(broken.length+"개 파일은 건너뛰었어요 (동기화 충돌본일 수 있어요)",true);
  loadVaultImages();
}
async function loadVaultImages(){
  if(!Vault.ok) return;
  let imgs;
  try{ imgs=await subDir("images"); }catch(e){ return; }
  let n=0;
  for(const it of ST.items.slice()){
    const file=it.img&&it.img.file;
    if(!file||URLS.has(it.id)) continue;
    try{
      const h=await imgs.getFileHandle(file);
      const f=await h.getFile();
      URLS.set(it.id,URL.createObjectURL(f));
      n++;
      if(n%6===0){ renderArchive(); }
    }catch(e){ /* 이미지 없음 */ }
  }
  if(n){ renderArchive(); graphDirty(); }
}

/* 외부(다른 컴퓨터) 변경 반영 */
async function vaultSync(quiet){
  if(!Vault.ok||Vault.busy>0||Vault.loading) return;
  let changed=false;
  try{
    try{
      const fh=await Vault.dir.getFileHandle("tags.json");
      const f=await fh.getFile();
      if(f.lastModified>Vault.tagsSeen){
        Vault.tagsSeen=f.lastModified;
        const d=JSON.parse(await f.text());
        (d.tags||[]).forEach(t=>ensureTag(t.name,t.cat));
        changed=true;
      }
    }catch(e){}
    try{
      const fh=await Vault.dir.getFileHandle("spaces.json");
      const f=await fh.getFile();
      if(f.lastModified>Vault.spacesSeen){
        Vault.spacesSeen=f.lastModified;
        applySpaceMeta((JSON.parse(await f.text())||{}).spaces||[]);
        changed=true;
      }
    }catch(e){}
    try{
      const bh=await Vault.dir.getFileHandle("boards.json");
      const bf=await bh.getFile();
      if(bf.lastModified>Vault.boardsSeen){
        Vault.boardsSeen=bf.lastModified;
        applyBoards((JSON.parse(await bf.text())||{}).boards||[]);
        changed=true;
      }
    }catch(e){}
    const notes=await subDir("notes");
    const present=new Set();
    for await (const [name,h] of notes.entries()){
      if(h.kind!=="file"||!/\.json$/i.test(name)) continue;
      present.add(name);
      const prev=Vault.seen.get(name)||0;
      let f;
      try{ f=await h.getFile(); }catch(e){ continue; }
      if(f.lastModified<=prev) continue;
      try{
        const d=JSON.parse(await f.text());
        if(!d||!d.id||name!==d.id+".json") continue;
        const inc=itemFromNote(d);
        const i=ST.items.findIndex(x=>x.id===inc.id);
        if(i<0){ ST.items.push(inc); changed=true; }
        else if((inc.updatedAt||0)>(ST.items[i].updatedAt||0)){
          if(CUR&&CUR.id===inc.id) continue;   // 편집 중인 항목은 건드리지 않음
          ST.items[i]=inc; changed=true;
        }
        Vault.seen.set(name,f.lastModified);
      }catch(e){}
    }
    Vault.seen.forEach((v,name)=>{
      if(present.has(name)) return;
      const id=name.replace(/\.json$/,"");
      const i=ST.items.findIndex(x=>x.id===id);
      if(i>=0&&(!CUR||CUR.id!==id)){ ST.items.splice(i,1); changed=true; }
      Vault.seen.delete(name);
    });
  }catch(e){ if(!quiet) vaultTrouble(e); return; }
  Vault.lastSync=Date.now();
  if(changed){ pruneTags(); pruneSpaces(); pruneBoards(); renderAll(); loadVaultImages(); }
  renderVaultUI();
}

/* 연결 */
async function pickFolder(){
  if(!FS_OK){ toast("이 브라우저는 폴더 저장을 지원하지 않아요. Chrome이나 Edge에서 열어주세요.",true); return; }
  let handle;
  try{ handle=await window.showDirectoryPicker({id:"gusuk",mode:"readwrite",startIn:"documents"}); }
  catch(e){
    if(e&&e.name==="AbortError") return;
    if(e&&e.name==="SecurityError"){ toast("이 화면에서는 폴더를 열 수 없어요. 내려받은 HTML 파일을 직접 열어주세요.",true); return; }
    toast("폴더를 열지 못했어요: "+(e&&e.message||e),true); return;
  }
  await connectFolder(handle,true);
}
async function connectFolder(handle,fromPicker){
  try{
    const q=await handle.queryPermission({mode:"readwrite"});
    if(q!=="granted"){
      if(!fromPicker) return false;
      const r=await handle.requestPermission({mode:"readwrite"});
      if(r!=="granted"){ toast("폴더 쓰기 권한이 필요해요.",true); return false; }
    }
  }catch(e){ return false; }
  const carry=fromPicker?ST.items.slice():[];
  Vault.dir=handle; Vault.ok=true; Vault.name=handle.name;
  try{ await kvPut("dirHandle",handle); }catch(e){}
  URLS.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} });
  URLS.clear(); IMGS.clear();
  await vaultLoadAll();
  if(carry.length && fromPicker){
    const have=new Set(ST.items.map(x=>x.id));
    const move=carry.filter(x=>!have.has(x.id));
    if(move.length && confirm("이 브라우저에 저장돼 있던 "+move.length+"장을 폴더로 옮길까요?")){
      await migrateToFolder(move);
    }
  }
  startWatch();
  renderVaultUI();
  return true;
}
async function migrateToFolder(list){
  toast(list.length+"장을 폴더로 옮기는 중…");
  for(const it of list){
    let blob=null;
    try{ blob=await imgGet(it.img&&it.img.key); }catch(e){}
    const copy=JSON.parse(JSON.stringify(it));
    copy.img={key:copy.id,file:null,w:(it.img&&it.img.w)||3,h:(it.img&&it.img.h)||2};
    ST.items.push(copy);
    if(blob){
      const ext=(blob.type||"").indexOf("webp")>=0?"webp":"jpg";
      await vaultWriteImage(copy,blob,ext);
      URLS.set(copy.id,URL.createObjectURL(blob));
    }
    await vaultWriteNote(copy);
  }
  await vaultWriteTags();
  renderAll();
  toast(list.length+"장을 폴더로 옮겼어요");
}
async function restoreFolder(){
  if(!FS_OK) return false;
  let handle;
  try{ handle=await kvGet("dirHandle"); }catch(e){ return false; }
  if(!handle) return false;
  Vault.dir=handle; Vault.name=handle.name||"";
  let perm="denied";
  try{ perm=await handle.queryPermission({mode:"readwrite"}); }catch(e){ return false; }
  if(perm==="granted"){
    Vault.ok=true;
    await vaultLoadAll(); startWatch(); renderVaultUI();
    return true;
  }
  Vault.ok=false; renderVaultUI();   // 사용자가 버튼을 눌러 다시 허용해야 함
  return false;
}
async function reconnectFolder(){
  if(!Vault.dir) return pickFolder();
  try{
    const r=await Vault.dir.requestPermission({mode:"readwrite"});
    if(r!=="granted"){ toast("폴더 권한이 필요해요.",true); return; }
  }catch(e){ return pickFolder(); }
  Vault.ok=true;
  await vaultLoadAll(); startWatch(); renderVaultUI();
}
function startWatch(){
  clearInterval(Vault.timer);
  Vault.timer=setInterval(()=>{ if(!document.hidden) vaultSync(true); },20000);
}

/* 폰에서 볼 묶음 */
async function writeMobileBundle(){
  if(!Vault.ok){ toast("먼저 폴더를 연결해 주세요.",true); return; }
  if(!ST.items.length){ toast("아직 담은 사진이 없어요.",true); return; }
  toast("묶음을 만드는 중…");
  const packs=await buildPacks();
  try{
    const dir=await subDir("mobile");
    for await (const [name,h] of dir.entries()){
      if(h.kind==="file"&&/^bundle-\d+\.json$/.test(name)){ try{ await dir.removeEntry(name); }catch(e){} }
    }
    for(let i=0;i<packs.length;i++){
      const payload={app:"gusuk",v:1,exportedAt:Date.now(),part:i+1,parts:packs.length,
        tags:ST.tags,items:packs[i]};
      await writeText(dir,"bundle-"+(i+1)+".json",JSON.stringify(payload));
    }
    toast("mobile 폴더에 "+packs.length+"개 파일로 넣어뒀어요");
  }catch(e){ vaultTrouble(e); }
}

/* ── 저장 반영 ─────────────────────────────────────── */
async function flushDirty(){
  if(!Vault.ok){ DIRTY.clear(); return; }
  const ids=Array.from(DIRTY); DIRTY.clear();
  for(const id of ids){
    const it=ST.items.find(x=>x.id===id);
    if(it) await vaultWriteNote(it);
  }
  await vaultWriteTags();
  Vault.lastSync=Date.now();
  renderVaultUI();
}

/* ── 상태 표시 ─────────────────────────────────────── */
function timeAgo(ts){
  if(!ts) return "";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<50) return "방금";
  if(s<3600) return Math.floor(s/60)+"분 전";
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function renderVaultUI(){
  const wrap=$("#vaultWrap"); if(!wrap) return;
  wrap.hidden=!FOLDER_UI;
  const setup=$("#setupBox");
  if(!FOLDER_UI){
    if(setup) setup.innerHTML = ST.items.length
      ? '<div class="setup" style="padding:13px 16px;margin-bottom:18px"><p style="margin:0;max-width:70ch">이 기기에서는 기록이 이 브라우저 안에만 저장돼요. 컴퓨터(Chrome·Edge)에서 열면 폴더에 파일로 저장하고 드라이브로 옮길 수 있습니다. 기기끼리 옮길 때는 <code>백업 저장</code> → <code>불러오기</code>를 쓰세요.</p></div>'
      : "";
    return;
  }
  const btn=$("#vaultBtn"), led=btn.querySelector(".led"),
        nm=btn.querySelector(".nm"), st=btn.querySelector(".st");
  if(Vault.ok){
    btn.classList.remove("off");
    nm.textContent=Vault.name||"폴더";
    const pend=DIRTY.size||Vault.busy||Vault.loading;
    led.className="led "+(pend?"wait":"on");
    st.textContent=Vault.loading?"읽는 중":(pend?"저장 중":(Vault.lastSync?"· "+timeAgo(Vault.lastSync):""));
    if(setup) setup.innerHTML="";
  }else{
    btn.classList.add("off");
    led.className="led"+(Vault.dir?" err":"");
    nm.textContent=Vault.dir?"폴더 다시 연결":"폴더 연결";
    st.textContent="";
    if(setup) setup.innerHTML=setupHTML();
  }
}
function setupHTML(){
  if(!FS_OK){
    return '<div class="setup"><h3>이 브라우저에서는 폴더 저장이 안 돼요</h3>'+
      '<p>사진과 메모를 폴더에 파일로 저장하는 기능은 Chrome과 Edge에서만 동작합니다. 지금은 이 브라우저 안에만 저장되고 다른 기기와 이어지지 않아요. 같은 파일을 Chrome이나 Edge에서 열면 폴더를 연결할 수 있습니다.</p></div>';
  }
  if(Vault.dir){
